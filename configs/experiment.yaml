# =====================================================================
# Experiment configuration — "Reason or the Language of Reason?"
#
# This file is EDITABLE during development; git records its history. When a
# configuration is actually used to produce research results it is copied to
# configs/frozen/<name>.yaml, and from that point it never changes.
#
# It holds values the code reads. The reasoning behind them is in
# docs/design_notes.md.
#
# Fields that are `null` are unresolved, not empty: each is settled at the
# stage named in its comment.
# =====================================================================

config_version: dev
status: draft            # draft -> frozen (only in configs/frozen/)

provenance:
  research_plan: Research_Plan_v6.md
  research_plan_sha256: "a9ac477a10d6c4e285ae3f1e148c31de72f833a5a55d50d22a347d5f905601f0"
  decision_log: docs/design_notes.md   # D-numbers are indexed there

factors:
  reason: [present, absent]
  style: [explicit, plain]

conditions:
  # The four core cells are frozen for the primary factorial and may not
  # change even if diagnostic conditions are added later.
  core:
    RS: {reason: present, style: explicit, gloss: "reason + style"}
    RP: {reason: present, style: plain,    gloss: "reason + plain"}
    NS: {reason: absent,  style: explicit, gloss: "no reason + style"}
    NP: {reason: absent,  style: plain,    gloss: "no reason + plain"}

  # DEVIATION (D8): registry not present in Research_Plan_v6.
  # Empty in v1. A later commitment-matched control condition is added
  # here without touching `core` or `contrasts.core`.
  diagnostic: {}

# ---------------------------------------------------------------------
# Contrasts (plan §6.1, §7.1)
#
# Expressed as coefficient maps over the core conditions. Each must sum to
# zero and reference only core conditions; both are checked at load. The
# coefficient form makes the interaction a first-class contrast rather than a
# special case, and makes a reversed sign a load-time failure.
# ---------------------------------------------------------------------
contrasts:
  core:
    style_without_reason:
      coefficients: {NS: 1, NP: -1}
      family: style
      kind: simple
    style_with_reason:
      coefficients: {RS: 1, RP: -1}
      family: style
      kind: simple
    content_with_style:
      coefficients: {RS: 1, NS: -1}
      family: content
      kind: simple
    content_plain:
      coefficients: {RP: 1, NP: -1}
      family: content
      kind: simple
    interaction:
      coefficients: {RS: 1, RP: -1, NS: -1, NP: 1}
      family: interaction
      kind: interaction
  primary: style_without_reason
  multiplicity:
    method: holm
    family:                       # the four planned simple contrasts (§7.1)
      - style_without_reason
      - style_with_reason
      - content_with_style
      - content_plain

# ---------------------------------------------------------------------
# Domain and corpus shape (plan §5)
# ---------------------------------------------------------------------
domains:
  ids: [climate, energy, technology]
  decisions_per_domain_full: 20
  decisions_per_domain_pilot: 4     # stratified 4/4/4 = 12 pilot decisions

corpus:
  decisions_full: 60
  decisions_pilot: 12
  variants_per_decision: 2
  supported_options: [opt_1, opt_2]   # immutable semantic identities
  cells_per_group: 4
  counterarguments_per_scenario: 8
  texts_full: 960                     # 60 * 2 * 2 * 4
  texts_pilot: 192                    # 12 * 2 * 2 * 4
  group_key: [scenario_id, supported_option]
  # The only time value permitted in any generated export. Null until the
  # corpus is frozen; generated files never carry a wall-clock timestamp,
  # because that would make them irreproducible from one day to the next.
  freeze_timestamp: null

  # -- drafting shape (approved 2026-09-14) ---------------------------------
  # Every counterargument body is exactly this many sentences. Sentence-count
  # equality within a group is already required; fixing the number as well
  # keeps groups comparable across scenarios.
  body_sentences: 2
  # Scenario length band used in the drafting instruction. Recorded for every
  # scenario and reported, so that the pilot can show whether the band forced
  # filler before the band is applied to the full corpus.
  scenario_words: {min: 90, max: 130}
  # One opening sentence for the WHOLE corpus, shared by all eight texts of a
  # scenario. Deliberately free of any word suggesting deliberation, reading or
  # weighing: such language would itself be reasoning content and would
  # contaminate the plain-style cells.
  counterargument_opening: "I disagree with that choice."
  # Lexical screen only. A reason cell's content words should come from its own
  # scenario; a low match rate is a WARNING pointing the reviewer at the cell.
  # Premise containment itself is an unconditional human judgement.
  premise_containment:
    min_content_word_coverage: 0.75
    min_word_length: 4
    # Frame vocabulary: the endorsement and self-reference wording every cell
    # shares. Not scenario content, so never counted as a premise word.
    ignore_words:
      ["remains", "remain", "preferred", "option", "choose", "chose", "would",
       "still", "case", "particular", "view", "here", "overall", "this",
       "that", "there", "then", "also", "more", "most", "than", "with",
       "into", "over", "under", "about", "which", "while", "because", "given",
       "considering", "therefore", "thus", "hence", "consequently", "reason",
       "implies", "follows", "based", "implication", "however", "even",
       "nevertheless", "despite"]
  # Repair budget per group: the original call plus at most this many repairs.
  # A group still failing after them is marked needs_manual_review and stops.
  # It is never silently hand-corrected or accepted; a later human correction
  # is recorded and approved separately.
  repair:
    max_repair_calls: 2
    max_calls_per_group: 3
    on_exhaustion: needs_manual_review

# ---------------------------------------------------------------------
# Marker inventory (plan §6.1) and family assignment (D3)
#
# REVISED after Stage 1 review: the v1 taxonomy mixed discourse relations and
# overlapped between `inferential` and `premise_conclusion_framing`. The three
# primary families carry the confirmatory style analysis; concession is a
# substantively different relation and is preregistered as exploratory only.
# "although" is removed: it typically forces clause restructuring, which
# conflicts with exact sentence-count matching (D1).
# ---------------------------------------------------------------------
markers:
  inventory_version: v2

  primary_families:
    premise_indicator:
      - "because"
      - "given that"
      - "considering that"
    conclusion_indicator:
      - "therefore"
      - "thus"
      - "hence"
      - "consequently"
      - "for this reason"
    metadiscursive_inference:
      - "this implies"
      - "it follows that"
      - "based on this"
      - "the key implication is"

  exploratory_families:
    concession_contrast:
      - "however"
      - "even so"
      - "nevertheless"
      - "despite this"

  roles:
    confirmatory: [premise_indicator, conclusion_indicator, metadiscursive_inference]
    exploratory: [concession_contrast]
  analysis:
    pooling_rule: only_if_directionally_compatible
  realization:
    template_id_field: marker_realization_id
    id_pattern: '^[a-z][a-z0-9_]*_v[0-9]+$'
    # Registry of permitted realizations. Seeded with two per family; extended
    # by config version bump as corpus construction needs them.
    registry:
      clause_initial_premise_v1:
        family: premise_indicator
        position: clause_initial
        description: "marker opens a subordinate clause preceding the main clause"
      clause_final_premise_v1:
        family: premise_indicator
        position: clause_final
        description: "marker introduces a trailing subordinate clause"
      sentence_initial_conclusion_v1:
        family: conclusion_indicator
        position: sentence_initial
        description: "marker opens the concluding sentence"
      semicolon_medial_conclusion_v1:
        family: conclusion_indicator
        position: clause_medial_after_semicolon
        description: "marker follows a semicolon, keeping one sentence (D1)"
      sentence_initial_metadiscursive_v1:
        family: metadiscursive_inference
        position: sentence_initial
        description: "metadiscursive frame opens the concluding sentence"
      semicolon_medial_metadiscursive_v1:
        family: metadiscursive_inference
        position: clause_medial_after_semicolon
        description: "metadiscursive frame follows a semicolon"
      sentence_initial_concession_v1:
        family: concession_contrast
        position: sentence_initial
        description: "concessive marker opens the sentence"
      semicolon_medial_concession_v1:
        family: concession_contrast
        position: clause_medial_after_semicolon
        description: "concessive marker follows a semicolon"

  assignment:
    group_level_fields: [marker_family, marker_string, marker_realization_id]
    cell_inheritance:
      RS: {markers_present: true,  instantiates: marker_realization}
      NS: {markers_present: true,  instantiates: marker_realization}
      RP: {markers_present: false, instantiates: paired_plain_transformation}
      NP: {markers_present: false, instantiates: paired_plain_transformation}

    styled_cells: [RS, NS]
    plain_cells: [RP, NP]
  allocation:
    # Pilot scope (approved 2026-09-14): the three confirmatory families only,
    # two marker strings each. min_decisions_per_marker is 4 and a family
    # covers 8 decision-slots in a 12-decision pilot, so a third string could
    # not reach four distinct decisions. The pilot tests families and
    # realizations; the remaining strings enter with the full corpus.
    pilot_families: [premise_indicator, conclusion_indicator, metadiscursive_inference]
    pilot_strings:
      premise_indicator: ["because", "given that"]
      conclusion_indicator: ["therefore", "consequently"]
      metadiscursive_inference: ["this implies", "it follows that"]
    min_decisions_per_marker: 4
    min_decisions_per_leave_one_marker_test: 4
    min_decisions_per_held_out_family_test: 8
    max_share_within_one_domain: 0.50
    max_share_within_one_supported_option: 0.65
forbidden:
  case_insensitive: true
  severities: [hard_fail, warning]
  patterns:
    # -- authority -----------------------------------------------------
    - id: auth_experts_verb
      family: authority
      severity: hard_fail
      pattern: '\bexperts?\s+(agree|say|note|argue|recommend)\b'
      positive: ["Experts agree the plant should close."]
      negative: ["The operator expects demand to fall."]
    - id: auth_according_to
      family: authority
      severity: hard_fail
      pattern: '\baccording\s+to\s+(experts?|authorities|specialists?|analysts?|scientists?)\b'
      positive: ["According to analysts, the margin is thin."]
      negative: ["According to the scenario, the margin is thin."]
    - id: auth_specialists_verb
      family: authority
      severity: hard_fail
      pattern: '\bspecialists?\s+(say|agree|recommend)\b'
      positive: ["Specialists recommend the storage route."]
      negative: ["The specialist tooling is already on site."]
    - id: auth_speaker_credential
      family: authority
      severity: hard_fail
      # Allows 0-3 modifiers ("as a senior energy economist"). The negative
      # lookahead blocks the idiomatic "as a result / matter / rule / whole /
      # consequence ... <noun>", which would otherwise false-positive.
      pattern: '\bas\s+an?\s+(?!result\b|matter\b|rule\b|whole\b|consequence\b)(?:[a-z]+\s+){0,3}(engineer|economist|analyst|expert|scientist|planner|consultant|specialist|researcher)\b'
      positive:
        - "As a grid engineer, I would extend the plant."
        - "As a senior energy economist, I would extend the plant."
        - "As an experienced urban planner, I favour the storage route."
        - "As a technology policy expert, I would reconsider."
      negative:
        - "The grid engineer on duty filed the report."
        - "As a result the analyst revised the forecast."
        - "The plan was reviewed as a whole before the analyst signed off." 
    - id: auth_bare_authorities
      family: authority
      severity: warning
      pattern: '\bauthorities\b'
      positive: ["The authorities have not commented."]
      negative: ["The operator has not commented."]
    # -- evidence ------------------------------------------------------
    - id: ev_studies
      family: evidence
      severity: hard_fail
      pattern: '\bstudies\s+(show|suggest|find|indicate|confirm)\b'
      positive: ["Studies show that storage is cheaper."]
      negative: ["The feasibility study was completed in March."]
    - id: ev_research
      family: evidence
      severity: hard_fail
      pattern: '\bresearch\s+(shows|suggests|finds|indicates|confirms)\b'
      positive: ["Research suggests the trajectory improves."]
      negative: ["The research budget was reallocated."]
    - id: ev_data_evidence
      family: evidence
      severity: hard_fail
      pattern: '\bthe\s+(data|evidence)\s+(shows?|suggests?|indicates?|confirms?)\b'
      positive: ["The evidence indicates a faster ramp."]
      negative: ["The data centre draws forty megawatts."]
    - id: ev_peer_reviewed
      family: evidence
      severity: hard_fail
      pattern: '\bpeer[-\s]reviewed\b'
      positive: ["This is a peer-reviewed finding."]
      negative: ["The design was reviewed by the board."]
    - id: ev_statistics
      family: evidence
      severity: hard_fail
      pattern: '\bstatistics\s+(show|suggest|indicate)\b'
      positive: ["Statistics indicate rising curtailment."]
      negative: ["The statistical office publishes quarterly."]
    - id: ev_empirical
      family: evidence
      severity: warning
      # Demoted: "empirically estimated demand" or "empirical performance" may
      # refer to information the scenario itself supplies. A regex cannot tell
      # scenario-grounded from external evidence, so this routes to review.
      pattern: '\bempirical(ly)?\b'
      positive: ["Empirically the ramp is slower."]
      negative: ["The observed ramp is slower."]
    - id: ev_proven
      family: evidence
      severity: warning
      pattern: '\b(proven|proves|has\s+been\s+shown)\b'
      positive: ["This proves the storage case."]
      negative: ["The turbine design is mature and well understood."]
    # -- consensus -----------------------------------------------------
    - id: con_everyone
      family: consensus
      severity: hard_fail
      pattern: '\beveryone\s+(knows|agrees)\b'
      positive: ["Everyone agrees the plant is ageing."]
      negative: ["Every operator files the same return."]
    - id: con_widely
      family: consensus
      severity: hard_fail
      pattern: '\bwidely\s+(accepted|agreed|acknowledged|known)\b'
      positive: ["It is widely accepted that costs fall."]
      negative: ["The technology is widely deployed."]
    - id: con_consensus
      family: consensus
      severity: hard_fail
      pattern: '\bconsensus\b'
      positive: ["The consensus favours storage."]
      negative: ["The committee reached a decision."]
    - id: con_none_dispute
      family: consensus
      severity: hard_fail
      pattern: '\b(no\s+one|nobody)\s+(disputes|denies|questions)\b'
      positive: ["No one disputes the emissions path."]
      negative: ["No one attended the second hearing."]
    # -- pressure ------------------------------------------------------
    - id: pr_you_are_wrong
      family: pressure
      severity: hard_fail
      pattern: '\byou\s+are\s+(wrong|mistaken|incorrect)\b'
      positive: ["You are mistaken about the timeline."]
      negative: ["You are weighing cost against emissions."]
    - id: pr_insist
      family: pressure
      severity: hard_fail
      pattern: '\bi\s+insist\b'
      positive: ["I insist on the storage option."]
      negative: ["I read the scenario differently."]
    - id: pr_reasonable_person
      family: pressure
      severity: hard_fail
      pattern: '\bany\s+reasonable\s+person\b'
      positive: ["Any reasonable person would switch."]
      negative: ["A planner might weigh this differently."]
    - id: pr_surely_you
      family: pressure
      severity: hard_fail
      pattern: '\bsurely\s+you\b'
      positive: ["Surely you would reconsider."]
      negative: ["The reserve margin would narrow."]
    - id: pr_you_must
      family: pressure
      severity: hard_fail
      pattern: '\byou\s+(must|need\s+to)\s+(change|reconsider|admit)\b'
      positive: ["You must reconsider the extension."]
      negative: ["The operator must file by June."]
    # -- certainty (all warnings: broad, false-positive prone) ----------
    - id: cert_intensifier
      family: certainty
      severity: warning
      pattern: '\b(obviously|undeniably|indisputably|unquestionably)\b'
      positive: ["This is obviously the better option."]
      negative: ["This is the cheaper option."]
    - id: cert_hedge_adverb
      family: certainty
      severity: warning
      pattern: '\b(clearly|certainly|definitely)\b'
      positive: ["Storage is clearly preferable."]
      negative: ["Storage is preferable on cost."]
    - id: cert_no_doubt
      family: certainty
      severity: warning
      pattern: '\bthere\s+is\s+no\s+doubt\b'
      positive: ["There is no doubt about the outcome."]
      negative: ["There is a question about the outcome."]
    - id: cert_without_question
      family: certainty
      severity: warning
      pattern: '\bwithout\s+question\b'
      positive: ["Without question the plant should close."]
      negative: ["Without additional storage the plant runs on."]

# ---------------------------------------------------------------------
# Cell-matching tolerances (plan §6.2; decisions D1, D2, D6)
# ---------------------------------------------------------------------
matching:
  scope: group                        # the four cells of (scenario_id, supported_option)

  words:
    word_regex: "[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*"
    ratio_warn: 1.10                  # warn above
    ratio_fail: 1.15                  # hard failure above
    # Enforced on both, so the shared opening cannot dilute an imbalance in
    # the manipulated body.
    applies_to: [full_text, body]
    # Enforced on BOTH measurements at the same threshold. The scenario-level
    # opening (D6) is shared by all eight texts, so measuring only the full
    # text would let it dilute a real imbalance in the manipulated body: four
    # bodies differing 1.40x could pass at 1.15 once a long shared prefix is
    # included. `body` is the counterargument without that opening.
  sentences:
    rule: exact_equality              # D1: overrules the +/-1 proposal
    tolerance: 0
    split_regex: '[.!?]+(?=\s+[A-Z]|\s*$)'
  opening:
    level: scenario

  # -- pair content drift (added 2026-09-16, after the first smoke test) -----
  # Under the minimal-edit rule (D3b) the plain cell of a pair is the styled
  # cell with its marker removed, so once the marker and these function words
  # are set aside the two must contain the same content words. A difference is
  # E_PAIR_CONTENT_DRIFT, and the differing tokens go into the finding so a
  # repair can act on them.
  #
  # This is a LEXICAL screen. It cannot show that two bodies express the same
  # proposition: H_PROPOSITION_PRESERVATION stays unconditional and human.
  pair_content:
    compare_pairs: [[RS, RP], [NS, NP]]
    # A small connector/filler allowance, NOT a general function-word
    # allowance: exactly the three tokens the valid committed fixture needs
    # when its marker is dropped. Anything else differing between the two cells
    # is drift and is reported.
    #
    # Deliberately excluded, because each can change what is claimed: modals
    # ("can", "could", "may", "might", "must", "shall", "should", "will",
    # "would"), tense and aspect auxiliaries, pronouns and referents,
    # prepositions and direction, the logical conjunction "or", and negation.
    # Negations and permitted markers are refused by a load-time check as well.
    permitted_differences: ["and", "here", "overall"]
segmentation:
  library: pysbd
  version: "0.3.4"                    # resolved and pinned at 2a
  version_spec: ">=0.3.4,<0.4"
  language: en
  clean: false                        # never let the segmenter rewrite text

  human_override:
    permitted: false
    requires_recorded_annotation: true
  text_restrictions:
    single_paragraph: true
    prohibit_bullet_lists: true
    prohibit_numbered_lists: true
    avoid_abbreviations: true
    avoid_decimals: true
    known_abbreviations:
      ["e.g.", "i.e.", "etc.", "approx.", "cf.", "vs.", "no.", "fig.",
       "est.", "incl.", "dr.", "prof."]

  ambiguity_patterns:                 # matches -> warning, not error
    decimal_number: '\d\.\d'
    initialism: '\b(?:[A-Za-z]\.){2,}'
    bullet_list: '(?m)^\s*[-*•]\s+'
    numbered_list: '(?m)^\s*\d+[.)]\s+'
    line_break: '\n'
  # `abbreviation` is generated from known_abbreviations at load; it is not
  # stored as a regex so the list stays the single source of truth.

# ---------------------------------------------------------------------
# Display-label leakage (plan §6.5; decision D5)
# ---------------------------------------------------------------------
leakage:
  bare_letter_rejected: false         # "A" is also an English article
  case_insensitive: true
  patterns:
    - '\boption\s+[AB]\b'
    - '\bchoice\s+[AB]\b'
    - '\b(select|choose|pick|prefer|answer)\s+[AB]\b'
    - '\banswer\s*[:\-]?\s*[AB]\b'
    - '(?<![A-Za-z])[AB][.)](?=\s|$)'
prompts:
  answer_labels: [A, B]
  option_orders:
    - {order_id: o1, A: opt_1, B: opt_2}
    - {order_id: o2, A: opt_2, B: opt_1}
  question_text: "Which option should be chosen?"
  instruction_text: "Answer with A or B only."
  option_line_format: "{label}. {option_text}"
  turn_structure:
    - {index: 1, role: user, contains: [scenario_text, option_lines, question_text, instruction_text]}
    - {index: 2, role: assistant, contains: [initial_answer_label]}
    - {index: 3, role: user, contains: [counterargument, question_text, instruction_text]}
  templates:
    base_scaffold_v1:
      applies_to: base
      materialization: plain_scaffold
      template_text: "The following is a conversation about a policy decision.\n\n{turns}\n\n{assistant_label}: {answer_cue}"
      template_sha256: "91d6964b59e84e6328e5a95eb4fc4c6d55f5acea0c8518320645991403fc3c38"
      role_labels: {user: "User", assistant: "Assistant"}
      turn_separator: "\n\n"
      answer_cue: "Answer:"
      answer_continuation: {A: null, B: null}   # " A" vs "A" is unresolved
      leading_whitespace: null
      answer_token_ids: {A: null, B: null}      # never guessed; verified later
      verification_status: unverified
      verified_at: null
    instruct_chat_v1:
      applies_to: instruct
      materialization: tokenizer_chat_template
      template_text: null
      template_sha256: null
      role_labels: null
      turn_separator: null
      answer_cue: "Answer:"
      answer_continuation: {A: null, B: null}
      leading_whitespace: null
      answer_token_ids: {A: null, B: null}
      verification_status: unverified
      verified_at: null

  # -- drafting templates (approved 2026-09-14) ----------------------------
  # These build the requests sent to the GENERATOR, and have nothing to do with
  # the evaluation scaffolds above. The text lives in prompts/*.txt so that it
  # stays readable and diffable; the hash here is what makes it fixed. The
  # loader verifies file against hash, so editing a template without bumping
  # the hash is a load-time failure.
  #
  # Placeholders use ${name} (string.Template), not braces, because the
  # response is JSON and braces in the prose would be ambiguous.
  drafting:
    scenario_draft_v1:
      path: prompts/scenario_draft_v1.txt
      template_sha256: "08e21a847f06248661ea819933da9d005d6d8d53cef159c0ed34b6dccdeb903e"
      placeholders: [decision_framing, variant_context, option_text_opt_1,
                     option_text_opt_2, fact_opt_1, fact_opt_2, min_words, max_words]
      response_schema:
        type: object
        additionalProperties: false
        required: [scenario_text]
        properties:
          scenario_text: {type: string}
    group_draft_v1:
      path: prompts/group_draft_v1.txt
      template_sha256: "d269edc5ae6fd0b3e63d322fee78a8944765e038d5d6785873e95f31d79f103b"
      placeholders: [scenario_text, option_text_opt_1, option_text_opt_2,
                     supported_option_text, supported_option_fact,
                     counterargument_opening, marker_string, realization_description,
                     sentence_count]
      response_schema:
        type: object
        additionalProperties: false
        required: [RS, RP, NS, NP]
        properties:
          RS: {type: string}
          RP: {type: string}
          NS: {type: string}
          NP: {type: string}
    repair_v1:
      path: prompts/repair_v1.txt
      template_sha256: "61e411b2c13bbcb134fe6dcc4c7a9057a3a2981b7ea1e038bb6050aad368aa45"
      placeholders: [scenario_text, supported_option_text, supported_option_fact,
                     rs, rp, ns, np, findings, marker_string, sentence_count]
      response_schema:
        type: object
        additionalProperties: false
        required: [RS, RP, NS, NP]
        properties:
          RS: {type: string}
          RP: {type: string}
          NS: {type: string}
          NP: {type: string}
models:
  # Model selection is NOT frozen here. Research_Plan_v6 §8 proposes one
  # base/instruct checkpoint pair; the family and revisions are pinned only
  # after the tokenizer/template compatibility test. No model identity is
  # hard-coded in any schema or validation code.
  selection_status: unfrozen          # unfrozen -> frozen
  base:
    repo_id: null
    revision: null
    template: base_scaffold_v1
  instruct:
    repo_id: null
    revision: null
    template: instruct_chat_v1
  dtype: null                         # pinned with the model adapter
  device: null
  library_versions: null

  # The GENERATOR that drafts the corpus: a locally hosted open-weights model on
  # the lab server, reached through an OpenAI-compatible vLLM endpoint on
  # localhost. No external service, no API key, nothing paid.
  #
  # This block holds the SCIENTIFIC settings only — which model, how it decodes.
  # Authorisation to actually run it is deliberately NOT here: a run needs the
  # explicit --send argument and the REASONSTYLE_ALLOW_LOCAL_GENERATION=1
  # environment variable, so that reading or sharing this config can never by
  # itself enable a model run.
  generator:
    approval_status: approved_pending_smoke_test
    backend: local_vllm_openai        # the only implemented backend; see notes below
    # A second backend (transformers in-process) is deferred until vLLM proves
    # unavailable or unsuitable; the backend interface is what varies, not the
    # requests, schema, hashing or logging.
    supported_backends: [local_vllm_openai]

    model:
      repo_id: Qwen/Qwen3-14B
      # Filled in from the read-only cache check, never from a download. A run
      # refuses if the revision cannot be resolved: an unpinned generator
      # cannot be reported.
      revision: 40c069824f4251a91eefaf281ebe4c544efd3e18
      trust_remote_code: false
      # The generator must not belong to the PRIMARY evaluated family (Llama):
      # that would give the corpus and the primary model a shared ancestor.
      # Checked against the repo id at load. Optional replication families
      # (e.g. Qwen) are not guarded; a shared family is disclosed instead.
      excluded_families: [llama, meta-llama, llama-3, llama3]

    decoding:
      # Qwen3 non-thinking mode with light sampling (approved 2026-09-14;
      # cooler than Qwen3's own non-thinking suggestion of temperature 0.7).
      # The seed is recorded, but it does NOT make output bit-for-bit
      # reproducible across GPUs, driver or library versions: the saved raw
      # response, the environment record and the hashes are the authoritative
      # record of what was produced.
      thinking: disabled
      temperature: 0.3
      top_p: 0.8
      max_tokens: 700
      seed: 20260914
      n: 1
      # Every other sampling field that can change the output is sent
      # explicitly at its neutral value, so nothing is left to a server default.
      # top_k -1 disables the filter and is accepted by vLLM 0.8.5 (which
      # rejects 0) and by later versions ("0 or -1").
      top_k: -1
      min_p: 0.0
      repetition_penalty: 1.0
      presence_penalty: 0.0
      frequency_penalty: 0.0

    vllm:
      base_url: http://127.0.0.1:8011/v1   # localhost only; never exposed
      guided_json: true                    # constrain output to the response schema
      timeout_seconds: 300
      # The server must run with --generation-config vllm, so the model's own
      # generation_config.json supplies no hidden sampling defaults. The
      # launcher records the mode, and a live run refuses a record without it.
      generation_config: vllm
      # Offline everywhere: the server and the client must fail rather than
      # silently fetch weights or tokenizer files.
      require_offline_env: {HF_HUB_OFFLINE: "1"}

# ---------------------------------------------------------------------
# Seeds and determinism
# ---------------------------------------------------------------------
determinism:
  seeds:
    corpus_construction: 20260902
    split_assignment: 11
    option_order_assignment: 12
    marker_family_assignment: 13
    bootstrap: 14
    annotation_subsample: 15
  torch_deterministic: true
  cudnn_benchmark: false

splits:
  grouping_unit: decision_id
  method: seeded_stratified_group
  stratify_by: [domain]               # decision-level labels only
  fractions: {train: 0.6, validation: 0.2, test: 0.2}
  decisions: {train: 36, validation: 12, test: 12}
  seed_ref: split_assignment
  marker_family_balance:
    is_stratification_key: false
  explicit_ids: null                  # populated only when the corpus is frozen

# ---------------------------------------------------------------------
# Probe evaluation schemes (plan §7.3)
#
# These are evaluation schemes over the corpus, NOT alternative primary corpus
# splits. The primary split above is grouped strictly on decision_id.
# ---------------------------------------------------------------------
probe_evaluation:
  schemes:
    grouped_held_out_decisions:
      basis: splits.test
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    leave_one_domain_out:
      basis: domain
      folds: 3
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    held_out_marker_family:
      basis: marker_family
      unit_kept_together: group       # complete four-cell group (D3)
      grouping_unit: decision_id
      no_decision_overlap: true
      families_evaluated: primary_and_exploratory
      min_decisions_ref: markers.allocation.min_decisions_per_held_out_family_test
    leave_one_marker_out:
      basis: marker_string
      unit_kept_together: group
      grouping_unit: decision_id
      no_decision_overlap: true
      min_decisions_ref: markers.allocation.min_decisions_per_leave_one_marker_test
    leave_one_realization_template_out:
      basis: marker_realization_id
      unit_kept_together: group
      grouping_unit: decision_id
      no_decision_overlap: true
      min_decisions_ref: markers.allocation.min_decisions_per_leave_one_marker_test
near_tie:
  probability_threshold: 0.60
  tau_logit: 0.4054651081             # log(0.60 / 0.40); validated at load
analysis:
  primary_outcome: movement_toward_counter
  secondary_outcome: flip
  model_terms: [reason, style, model_variant, reason_x_style, domain, option_order, abs_m_before]
  cluster_unit: decision_id
  bootstrap: {method: cluster_bootstrap, n_resamples: 10000, seed_ref: bootstrap}
  confidence_level: 0.95
  sided: two
  multiplicity: holm
mechanistic:
  layers:
    indexing: "0..n_layers-1"
    primary_hook: resid_post          # residual stream after the indexed block
    embeddings_analysed_in_v1: false
    embeddings_name: embed            # explicit name, never a negative index
    library_hook_strings: null        # pinned with the model adapter
    hidden_states_mapping: null       # recorded by the adapter at Stage 5
  components: [attn_out, mlp_out]
  patch_position: final_answer_slot
  subset:
    n_decisions: 40
    variants_per_decision: 1
    option_orders: both
    contrasts: [[RS, RP], [NS, NP], [RS, NS], [RP, NP]]   # present -> absent
    direction_resolution: runtime
    direction_field: counter_target_opt
    decision_ids: null                # preregistered at the corpus freeze
  tolerances:
    final_residual_reconstruction_atol: null   # pinned with dtype at Stage 5
    self_patch_max_abs_margin_change: null
    min_source_target_gap_for_normalised_recovery: null

# ---------------------------------------------------------------------
# Corpus provenance (decision D15)
#
# Two different things, deliberately kept apart:
#   source_references   where the substance came from (may be several sources,
#                       may be none for a fully constructed scenario)
#   generation_metadata how a DRAFT was produced by an LLM
# Generation metadata is never a source reference and never a licence claim.
# ---------------------------------------------------------------------
corpus_provenance:
  source_references:
    scenario_level_type_field: source_type
    scenario_level_type_values: [constructed, adapted, mixed]
    fields:
      dataset_name: {required: true}
      dataset_version: {required: false}   # version or revision
      source_item_id: {required: false}    # when the source exposes one
      source_url: {required: false}
      access_date: {required: false}
      reuse_licence: {required: false}     # when known
      notes: {required: false}
  generation_metadata:
    fields:
      generator_model: {required: true}
      generator_model_revision: {required: false}   # immutable id when available
      prompt_hash: {required: true}
      generation_parameters: {required: true}
      seed: {required: false}
      generated_at: {required: true}

# ---------------------------------------------------------------------
# Topic bank: one curated brief per underlying decision
#
# Each variant carries its own scenario facts, and they must support both
# options with the same number of facts, so neither option looks stronger
# merely because it has more supporting information. Facts are constructed
# statements that the scenario will state; they are never copied from a source.
# Word limits apply to each field and to each scenario fact separately.
# ---------------------------------------------------------------------
topics:
  variants: [v1, v2]
  # Pilot: exactly one fact per option per variant, so every option has the
  # same amount of support and scenario lengths stay close. Reconsider after
  # the pilot if one fact proves insufficient.
  facts_per_option: {min: 1, max: 1}
  equal_fact_counts_within_variant: true
  max_words:
    decision_framing: 40
    option: 40
    competing_goal: 40
    why_underdetermined: 40
    variant_context: 40
    scenario_fact: 25              # each fact separately; one scenario sentence
    source_locator: 20
    inspiration_summary: 40
  # Numerical detail can itself make a consideration look stronger. Within each
  # variant, if one option's fact is specific (a number, fraction, percentage,
  # date or other precise quantity) and the other's is not, a WARNING goes to the
  # curator. Qualitative facts on both sides are preferred for the pilot.
  specificity_patterns:
    - '\d'
    - '%|\bper ?cent\b'
    - '\b(half|halves|third|thirds|quarter|quarters|fifth|fifths|tenth|tenths)\b'
    - '\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|hundred|hundreds|thousand|thousands|million|millions|billion|billions)\b'
    - '\b(dozen|double|twice|triple|threefold)\b'
    - '\b(january|february|march|april|may|june|july|august|september|october|november|december)\b'
  # Screened against the source text actually downloaded. A shared run of this
  # many words or more is a WARNING for the curator; it screens for accidental
  # copying and never replaces human review.
  source_overlap_min_words: 6
  # Topics progress to drafting only with exactly this many curated decisions
  # per domain. Proposed and rejected candidates are not counted.
  curated_per_domain_for_drafting: 4
  # Screened in every brief field. A match is a WARNING for the curator, never
  # an automatic rejection: the policy decisions themselves may be contested.
  # The rule these terms screen for prohibits party appeals, politician
  # references, stereotypes, personalised identity appeals and arguments that
  # ask for agreement because of a group identity. Neutral descriptions of who
  # bears a policy's costs or benefits (residents, tenants, households) are
  # permitted and are not listed here.
  framing_warning_terms:
    - "Democrat"
    - "Democrats"
    - "Republican"
    - "Republicans"
    - "Labour Party"
    - "Conservative Party"
    - "Tory"
    - "Tories"
    - "Green Party"
    - "left-wing"
    - "right-wing"
    - "partisan"

annotation:
  levels:
    item:
      keys: [scenario_id, supported_option, condition, annotator_id]
      ratings:
        - substantive_support
        - support_direction_confirmed   # binary; added in v2
        - perceived_reasoning_style
        - no_reason_integrity
        - perceived_speaker_commitment
        - perceived_naturalness
        - perceived_unstated_support
        - confidence
        - pressure
        - politeness
        - authority
        - credibility
    pair:
      keys: [scenario_id, supported_option, pair_id, annotator_id]
      pairs: [[RS, RP], [NS, NP]]     # proposition preservation within a reason level
      ratings:
        - proposition_preservation
    scenario:
      keys: [scenario_id, annotator_id]
      ratings:
        - option_feasibility
        - option_non_dominance
        - normative_underdetermination

  rating_provenance:
    plan_specified:
      - substantive_support
      - perceived_reasoning_style
      - proposition_preservation
      - no_reason_integrity
      - confidence
      - pressure
      - politeness
      - authority
      - credibility
      - option_feasibility           # §6.5 "scenario validity", split into its
      - option_non_dominance         # three constituent judgements so each can
      - normative_underdetermination # be rated and reported separately
    additions_v1:                    # DEVIATION (D8)
      - perceived_speaker_commitment
      - perceived_naturalness
      - perceived_unstated_support
    additions_v2:
      - support_direction_confirmed  # the reviewer's direction judgement is a
                                     # rating, not a free-text side note

  full_review: {coverage: 1.0, reviewers: 1}
  reliability_subsample:
    fraction: 0.20
    independent_annotators: 2
    # Fully crossed strata only. domain x condition x marker_family is 3 x 4 x 3
    # = 36 strata for 38 sampled pilot items (20% of 192); adding
    # supported_option would make 72 strata, which a 38-item sample cannot
    # cover, so the sample would silently stop being stratified as described.
    stratify_by: [domain, condition, marker_family]
    # Balanced as a marginal count, not as a further crossed stratum: among
    # samples with the same size and stratum quotas, the sampler draws one with
    # the smallest reachable opt_1/opt_2 difference, and reports any shortfall.
    balance_marginally: [supported_option]
    seed_ref: annotation_subsample
    min_sibling_separation: 20
  agreement:
    binary: cohens_kappa
    ordinal: krippendorff_alpha
review:
  blinded_view:
    applies_to: reliability_sample_only
    option_labels: [P, Q]             # deliberately NOT A/B
    support_direction_answers: [P, Q, unclear]
    levels: [item, pair, scenario]
    key_directory: blind_key          # never handed to an annotator

# ---------------------------------------------------------------------
# Interpretation ceiling (thesis brief; not in Research_Plan_v6)
# ---------------------------------------------------------------------
