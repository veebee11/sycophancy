# =====================================================================
# Frozen experiment configuration — version v1
#
# "Reason or the Language of Reason?"  (Research_Plan_v6.md)
#
# IMMUTABILITY RULE (plan §15, decision "Additional decisions"):
#   This file must never be edited in place once it has produced an
#   artefact. Any change creates configs/experiment_v2.yaml. Fields that
#   are `null` here are UNRESOLVED, not empty: they are pinned by a
#   later config version at the stage named in the adjacent comment.
#
# Deviations from Research_Plan_v6.md are recorded in docs/decisions.md
# and flagged inline with `# DEVIATION (Dn)`.
# =====================================================================

config_version: v4
schema_version: v4
created: "2026-09-09"
status: draft            # draft -> frozen (frozen set at the pilot corpus freeze)

# Changes from v3 (Implementation Stage 3a). v1-v3 remain on disk, unmodified.
#   + prompts.question_text / instruction_text / turn_structure
#   ~ base_scaffold_v1:    frozen plain-text scaffold authored and hashed
#   ~ instruct_chat_v1:    materialization deferred to the tokenizer's own chat
#                          template at the model-compatibility stage
#
# Changes v2 -> v3 (Implementation Stage 3b). v1 and v2 remain unmodified.
#   + review:              deterministic human-review exporter settings
#   + corpus.freeze_timestamp: the ONLY time value any export may record
#   ~ annotation.reliability_subsample: sibling separation, per-annotator order
#
# Changes v1 -> v2 (Implementation Stage 2a):
#   + segmentation:        pinned deterministic sentence segmenter (D14)
#   + corpus_provenance:   extensible source-reference list, kept separate from
#                          LLM generation metadata (D15)
#   + markers.realizations: registry of syntactic realizations (D3b)
#   ~ matching.words:      ratio enforced on the full text AND the body
#   ~ models:              repo ids nulled; selection unfrozen pending the
#                          tokenizer/template compatibility test
#   ~ annotation:          + support_direction_confirmed (item level)
#   ~ provenance:          research_plan_sha256 follows the plan revision that
#                          names seven reference sources (not one dataset pair)
#                          and makes model selection provisional

provenance:
  research_plan: Research_Plan_v6.md
  research_plan_sha256: "a9ac477a10d6c4e285ae3f1e148c31de72f833a5a55d50d22a347d5f905601f0"
  decision_log: docs/decisions.md

freeze:
  edit_in_place_after_artifacts: forbidden
  change_procedure: new_config_version
  core_conditions_immutable: true
  core_contrasts_immutable: true

# ---------------------------------------------------------------------
# Factors and conditions (plan §6.1)
# ---------------------------------------------------------------------
factors:
  reason: [present, absent]
  style: [explicit, plain]

conditions:
  # The four core cells are frozen for the primary factorial and may not
  # change even if diagnostic conditions are added later.
  core:
    RS: {reason: present, style: explicit, gloss: "reason + style"}
    RP: {reason: present, style: plain,    gloss: "reason + plain"}
    NS: {reason: absent,  style: explicit, gloss: "no reason + style"}
    NP: {reason: absent,  style: plain,    gloss: "no reason + plain"}

  # DEVIATION (D8): registry not present in Research_Plan_v6.
  # Empty in v1. A later commitment-matched control condition is added
  # here without touching `core` or `contrasts.core`.
  diagnostic: {}

# ---------------------------------------------------------------------
# Contrasts (plan §6.1, §7.1)
#
# Expressed as coefficient maps over the core conditions. Each must sum to
# zero and reference only core conditions; both are checked at load. The
# coefficient form makes the interaction a first-class contrast rather than a
# special case, and makes a reversed sign a load-time failure.
# ---------------------------------------------------------------------
contrasts:
  core:
    style_without_reason:
      coefficients: {NS: 1, NP: -1}
      family: style
      kind: simple
      gloss: "style effect without a real reason"
    style_with_reason:
      coefficients: {RS: 1, RP: -1}
      family: style
      kind: simple
      gloss: "style effect with a real reason"
    content_with_style:
      coefficients: {RS: 1, NS: -1}
      family: content
      kind: simple
      gloss: "content effect under explicit style"
    content_plain:
      coefficients: {RP: 1, NP: -1}
      family: content
      kind: simple
      gloss: "content effect in plain language"
    interaction:
      coefficients: {RS: 1, RP: -1, NS: -1, NP: 1}
      family: interaction
      kind: interaction
      gloss: "(RS - RP) - (NS - NP)"
  primary: style_without_reason
  multiplicity:
    method: holm
    family:                       # the four planned simple contrasts (§7.1)
      - style_without_reason
      - style_with_reason
      - content_with_style
      - content_plain

# ---------------------------------------------------------------------
# Domain and corpus shape (plan §5)
# ---------------------------------------------------------------------
domains:
  ids: [climate, energy, technology]
  decisions_per_domain_full: 20
  decisions_per_domain_pilot: 4     # stratified 4/4/4 = 12 pilot decisions

corpus:
  decisions_full: 60
  decisions_pilot: 12
  variants_per_decision: 2
  supported_options: [opt_1, opt_2]   # immutable semantic identities
  cells_per_group: 4
  counterarguments_per_scenario: 8
  texts_full: 960                     # 60 * 2 * 2 * 4
  texts_pilot: 192                    # 12 * 2 * 2 * 4
  group_key: [scenario_id, supported_option]
  # The only time value permitted in any generated export. Null until the
  # corpus is frozen; generated files never carry a wall-clock timestamp,
  # because that would make them irreproducible from one day to the next.
  freeze_timestamp: null

# ---------------------------------------------------------------------
# Marker inventory (plan §6.1) and family assignment (D3)
#
# REVISED after Stage 1 review: the v1 taxonomy mixed discourse relations and
# overlapped between `inferential` and `premise_conclusion_framing`. The three
# primary families carry the confirmatory style analysis; concession is a
# substantively different relation and is preregistered as exploratory only.
# "although" is removed: it typically forces clause restructuring, which
# conflicts with exact sentence-count matching (D1).
# ---------------------------------------------------------------------
markers:
  inventory_version: v2

  primary_families:
    premise_indicator:
      - "because"
      - "given that"
      - "considering that"
    conclusion_indicator:
      - "therefore"
      - "thus"
      - "hence"
      - "consequently"
      - "for this reason"
    metadiscursive_inference:
      - "this implies"
      - "it follows that"
      - "based on this"
      - "the key implication is"

  exploratory_families:
    concession_contrast:
      - "however"
      - "even so"
      - "nevertheless"
      - "despite this"

  roles:
    confirmatory: [premise_indicator, conclusion_indicator, metadiscursive_inference]
    exploratory: [concession_contrast]
    rationale: >
      Concession marks a different discourse relation from premise and
      conclusion indication, so it cannot enter the confirmatory style
      estimate. It is retained as a preregistered robustness family.

  analysis:
    report_family_specific_effects: true
    test_family_by_style_interaction: true
    pooling_rule: only_if_directionally_compatible
    leave_one_marker_out: true
    leave_one_realization_template_out: true
    lexical_match_establishes_discourse_function: false
    human_validation_authoritative: true
    note: >
      A lexical match shows a marker is present. It does not show the marker
      performed its intended discourse function in context; only human
      validation (§6.5) establishes that.

  realization:
    template_id_field: marker_realization_id
    recorded_per: group               # stored once; all four cells inherit it
    note: >
      The surface template realizing a marker (position, punctuation, clause
      order) is recorded once per (scenario_id, supported_option) group so that
      leave-one-realization-template-out evaluation is possible.
    id_pattern: '^[a-z][a-z0-9_]*_v[0-9]+$'
    # Registry of permitted realizations. Seeded with two per family; extended
    # by config version bump as corpus construction needs them.
    registry:
      clause_initial_premise_v1:
        family: premise_indicator
        position: clause_initial
        description: "marker opens a subordinate clause preceding the main clause"
      clause_final_premise_v1:
        family: premise_indicator
        position: clause_final
        description: "marker introduces a trailing subordinate clause"
      sentence_initial_conclusion_v1:
        family: conclusion_indicator
        position: sentence_initial
        description: "marker opens the concluding sentence"
      semicolon_medial_conclusion_v1:
        family: conclusion_indicator
        position: clause_medial_after_semicolon
        description: "marker follows a semicolon, keeping one sentence (D1)"
      sentence_initial_metadiscursive_v1:
        family: metadiscursive_inference
        position: sentence_initial
        description: "metadiscursive frame opens the concluding sentence"
      semicolon_medial_metadiscursive_v1:
        family: metadiscursive_inference
        position: clause_medial_after_semicolon
        description: "metadiscursive frame follows a semicolon"
      sentence_initial_concession_v1:
        family: concession_contrast
        position: sentence_initial
        description: "concessive marker opens the sentence"
      semicolon_medial_concession_v1:
        family: concession_contrast
        position: clause_medial_after_semicolon
        description: "concessive marker follows a semicolon"

  assignment:
    level: group                      # (scenario_id, supported_option)
    one_family_per_group: true

    # Style is frozen at the realization, not merely at the family. RS and NS
    # must use the SAME marker string and the SAME syntactic realization, or
    # the content contrast RS - NS would also compare "therefore" against
    # "because", or one marker placement against another.
    #
    # To state the control precisely: RS - NS is a content contrast because
    # BOTH cells are styled with the SAME marker realization, which therefore
    # cancels. Marker ABSENCE is not what controls RS - NS; absence is what
    # defines RP and NP, making RP - NP the corresponding content contrast in
    # plain language.
    group_level_fields: [marker_family, marker_string, marker_realization_id]
    same_realization_across_cells: true
    cell_inheritance:
      RS: {markers_present: true,  instantiates: marker_realization}
      NS: {markers_present: true,  instantiates: marker_realization}
      RP: {markers_present: false, instantiates: paired_plain_transformation}
      NP: {markers_present: false, instantiates: paired_plain_transformation}

    styled_cells: [RS, NS]
    plain_cells: [RP, NP]
    plain_marker_family_field: null           # plain cells: marker_family = null
    plain_inherited_family_field: inherited_marker_family
    holdout_keeps_group_together: true
    balance:
      across: [domain, supported_option, split]
      mechanism: allocation_constraint_then_post_split_check
      note: >
        Marker family is a property of a (scenario_id, supported_option) group,
        not of a decision, so it is never a decision-level stratification key.
    pilot_gate: >
      A configured marker does not prove the resulting NS text is reason-free.
      The pilot must establish, for each realization, that a genuine no-reason
      instance can be produced without smuggling in a premise.

  # Allocation constraints, checked at corpus construction and reported as
  # corpus statistics. They exist so that a nominal held-out-marker analysis
  # can never run on one or two decisions.
  allocation:
    applies_to: full_corpus
    min_decisions_per_marker: 4
    min_decisions_per_leave_one_marker_test: 4
    min_decisions_per_held_out_family_test: 8
    max_share_within_one_domain: 0.50
    max_share_within_one_supported_option: 0.65
    confirmatory_families_in_every_split: true
    report_as_corpus_statistic: true
    note: >
      With 60 decisions x 2 variants x 2 supported options = 240 groups over 16
      markers, roughly 15 groups per marker are available, so these minima are
      slack rather than binding. They are configurable and reported either way.

# ---------------------------------------------------------------------
# Forbidden phrase families (plan §6.1, §6.5; decision D7 + Stage 1 review)
#
# SCREENING ONLY. A regex can flag a phrase; it cannot establish the semantic
# absence of evidence, authority, consensus or pressure content. Human review
# (§6.5) remains authoritative.
#
# severity:
#   hard_fail  unambiguous authority / evidence / consensus / pressure phrasing
#   warning    broad patterns liable to false positives (certainty adverbs,
#              and domain terms such as "authorities" or "proven technology"
#              that are legitimate scenario facts) -> routed to human review
#
# Every pattern carries positive and negative fixtures, verified at load, so a
# pattern cannot be quietly weakened to resolve a collision.
# ---------------------------------------------------------------------
forbidden:
  case_insensitive: true
  severities: [hard_fail, warning]
  screening_note: >
    Regex matching is a screening tool. It cannot establish that a text is free
    of evidential, authoritative or coercive content; only human review can.
  patterns:
    # -- authority -----------------------------------------------------
    - id: auth_experts_verb
      family: authority
      severity: hard_fail
      pattern: '\bexperts?\s+(agree|say|note|argue|recommend)\b'
      positive: ["Experts agree the plant should close."]
      negative: ["The operator expects demand to fall."]
    - id: auth_according_to
      family: authority
      severity: hard_fail
      pattern: '\baccording\s+to\s+(experts?|authorities|specialists?|analysts?|scientists?)\b'
      positive: ["According to analysts, the margin is thin."]
      negative: ["According to the scenario, the margin is thin."]
    - id: auth_specialists_verb
      family: authority
      severity: hard_fail
      pattern: '\bspecialists?\s+(say|agree|recommend)\b'
      positive: ["Specialists recommend the storage route."]
      negative: ["The specialist tooling is already on site."]
    - id: auth_speaker_credential
      family: authority
      severity: hard_fail
      # Allows 0-3 modifiers ("as a senior energy economist"). The negative
      # lookahead blocks the idiomatic "as a result / matter / rule / whole /
      # consequence ... <noun>", which would otherwise false-positive.
      pattern: '\bas\s+an?\s+(?!result\b|matter\b|rule\b|whole\b|consequence\b)(?:[a-z]+\s+){0,3}(engineer|economist|analyst|expert|scientist|planner|consultant|specialist|researcher)\b'
      positive:
        - "As a grid engineer, I would extend the plant."
        - "As a senior energy economist, I would extend the plant."
        - "As an experienced urban planner, I favour the storage route."
        - "As a technology policy expert, I would reconsider."
      negative:
        - "The grid engineer on duty filed the report."
        - "As a result the analyst revised the forecast."
        - "The plan was reviewed as a whole before the analyst signed off." 
    - id: auth_bare_authorities
      family: authority
      severity: warning
      pattern: '\bauthorities\b'
      positive: ["The authorities have not commented."]
      negative: ["The operator has not commented."]
    # -- evidence ------------------------------------------------------
    - id: ev_studies
      family: evidence
      severity: hard_fail
      pattern: '\bstudies\s+(show|suggest|find|indicate|confirm)\b'
      positive: ["Studies show that storage is cheaper."]
      negative: ["The feasibility study was completed in March."]
    - id: ev_research
      family: evidence
      severity: hard_fail
      pattern: '\bresearch\s+(shows|suggests|finds|indicates|confirms)\b'
      positive: ["Research suggests the trajectory improves."]
      negative: ["The research budget was reallocated."]
    - id: ev_data_evidence
      family: evidence
      severity: hard_fail
      pattern: '\bthe\s+(data|evidence)\s+(shows?|suggests?|indicates?|confirms?)\b'
      positive: ["The evidence indicates a faster ramp."]
      negative: ["The data centre draws forty megawatts."]
    - id: ev_peer_reviewed
      family: evidence
      severity: hard_fail
      pattern: '\bpeer[-\s]reviewed\b'
      positive: ["This is a peer-reviewed finding."]
      negative: ["The design was reviewed by the board."]
    - id: ev_statistics
      family: evidence
      severity: hard_fail
      pattern: '\bstatistics\s+(show|suggest|indicate)\b'
      positive: ["Statistics indicate rising curtailment."]
      negative: ["The statistical office publishes quarterly."]
    - id: ev_empirical
      family: evidence
      severity: warning
      # Demoted: "empirically estimated demand" or "empirical performance" may
      # refer to information the scenario itself supplies. A regex cannot tell
      # scenario-grounded from external evidence, so this routes to review.
      pattern: '\bempirical(ly)?\b'
      positive: ["Empirically the ramp is slower."]
      negative: ["The observed ramp is slower."]
    - id: ev_proven
      family: evidence
      severity: warning
      pattern: '\b(proven|proves|has\s+been\s+shown)\b'
      positive: ["This proves the storage case."]
      negative: ["The turbine design is mature and well understood."]
    # -- consensus -----------------------------------------------------
    - id: con_everyone
      family: consensus
      severity: hard_fail
      pattern: '\beveryone\s+(knows|agrees)\b'
      positive: ["Everyone agrees the plant is ageing."]
      negative: ["Every operator files the same return."]
    - id: con_widely
      family: consensus
      severity: hard_fail
      pattern: '\bwidely\s+(accepted|agreed|acknowledged|known)\b'
      positive: ["It is widely accepted that costs fall."]
      negative: ["The technology is widely deployed."]
    - id: con_consensus
      family: consensus
      severity: hard_fail
      pattern: '\bconsensus\b'
      positive: ["The consensus favours storage."]
      negative: ["The committee reached a decision."]
    - id: con_none_dispute
      family: consensus
      severity: hard_fail
      pattern: '\b(no\s+one|nobody)\s+(disputes|denies|questions)\b'
      positive: ["No one disputes the emissions path."]
      negative: ["No one attended the second hearing."]
    # -- pressure ------------------------------------------------------
    - id: pr_you_are_wrong
      family: pressure
      severity: hard_fail
      pattern: '\byou\s+are\s+(wrong|mistaken|incorrect)\b'
      positive: ["You are mistaken about the timeline."]
      negative: ["You are weighing cost against emissions."]
    - id: pr_insist
      family: pressure
      severity: hard_fail
      pattern: '\bi\s+insist\b'
      positive: ["I insist on the storage option."]
      negative: ["I read the scenario differently."]
    - id: pr_reasonable_person
      family: pressure
      severity: hard_fail
      pattern: '\bany\s+reasonable\s+person\b'
      positive: ["Any reasonable person would switch."]
      negative: ["A planner might weigh this differently."]
    - id: pr_surely_you
      family: pressure
      severity: hard_fail
      pattern: '\bsurely\s+you\b'
      positive: ["Surely you would reconsider."]
      negative: ["The reserve margin would narrow."]
    - id: pr_you_must
      family: pressure
      severity: hard_fail
      pattern: '\byou\s+(must|need\s+to)\s+(change|reconsider|admit)\b'
      positive: ["You must reconsider the extension."]
      negative: ["The operator must file by June."]
    # -- certainty (all warnings: broad, false-positive prone) ----------
    - id: cert_intensifier
      family: certainty
      severity: warning
      pattern: '\b(obviously|undeniably|indisputably|unquestionably)\b'
      positive: ["This is obviously the better option."]
      negative: ["This is the cheaper option."]
    - id: cert_hedge_adverb
      family: certainty
      severity: warning
      pattern: '\b(clearly|certainly|definitely)\b'
      positive: ["Storage is clearly preferable."]
      negative: ["Storage is preferable on cost."]
    - id: cert_no_doubt
      family: certainty
      severity: warning
      pattern: '\bthere\s+is\s+no\s+doubt\b'
      positive: ["There is no doubt about the outcome."]
      negative: ["There is a question about the outcome."]
    - id: cert_without_question
      family: certainty
      severity: warning
      pattern: '\bwithout\s+question\b'
      positive: ["Without question the plant should close."]
      negative: ["Without additional storage the plant runs on."]

# ---------------------------------------------------------------------
# Cell-matching tolerances (plan §6.2; decisions D1, D2, D6)
# ---------------------------------------------------------------------
matching:
  scope: group                        # the four cells of (scenario_id, supported_option)

  words:
    definition: "max_words / min_words across the four cells in a group"
    word_regex: "[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*"
    ratio_warn: 1.10                  # warn above
    ratio_fail: 1.15                  # hard failure above
    # Enforced on BOTH measurements at the same threshold. The scenario-level
    # opening (D6) is shared by all eight texts, so measuring only the full
    # text would let it dilute a real imbalance in the manipulated body: four
    # bodies differing 1.40x could pass at 1.15 once a long shared prefix is
    # included. `body` is the counterargument without that opening.
    applies_to: [full_text, body]

  sentences:
    rule: exact_equality              # D1: overrules the +/-1 proposal
    tolerance: 0
    punctuation_may_differ: true
    semicolon_terminates_sentence: false   # a semicolon is an in-sentence
                                           # device for explicit framing (D1)
    split_regex: '[.!?]+(?=\s+[A-Z]|\s*$)'
    ambiguous_period_requires_human_confirmation: true   # decimals, abbreviations
    rationale: >
      Sentence count is itself a surface-form confound, so it is controlled
      rather than covaried. Explicit framing must be achieved within the same
      sentence count via connectives, semicolons or sentence-initial markers.

  opening:
    level: scenario                   # D6: one opening per scenario_id ...
    shared_across: all_eight_counterarguments   # ... prepended to all 8
    check: exact_equality_after_render
    must_not_mention: [option, condition, evidence, expertise, certainty, authority]

  model_token_counts:
    record: true
    role: diagnostic_only             # never substitutes for the word-count rule

  naturalness:
    human_rating_required: true       # D1: the check on exact sentence matching

# ---------------------------------------------------------------------
# Sentence segmentation (decision D14)
#
# D1 makes exact sentence-count equality a HARD rejection criterion, so the
# segmenter decides whether valid items enter the corpus. A hand-written regex
# miscounts the constructions this domain produces ("In the U.S. Storage costs
# fell", "40.5 GW", "approx.") and its errors would correlate with the style
# factor, biasing the very confound D1 exists to control.
#
# pysbd is rule-based and deterministic: no statistical model, no data
# download, no network. It is still a HEURISTIC, not ground truth, so
# constructions it is known to handle poorly are flagged rather than trusted.
# ---------------------------------------------------------------------
segmentation:
  library: pysbd
  version: "0.3.4"                    # resolved and pinned at 2a
  version_spec: ">=0.3.4,<0.4"
  language: en
  clean: false                        # never let the segmenter rewrite text

  authority: machine_count_authoritative
  human_override:
    permitted: false
    requires_recorded_annotation: true
    note: >
      A reviewer may FLAG a suspected segmentation error. The machine count
      remains authoritative and is never silently overridden; a correction
      requires a recorded annotation carrying a reason.

  guarantees:
    # Regression-tested. D1 permits a semicolon as the device that achieves
    # explicit framing inside one sentence, so a segmenter that split on ";"
    # would make the style manipulation impossible to length-match.
    semicolon_does_not_terminate_sentence: true

  text_restrictions:
    single_paragraph: true
    prohibit_bullet_lists: true
    prohibit_numbered_lists: true
    avoid_abbreviations: true
    avoid_decimals: true
    known_abbreviations:
      ["e.g.", "i.e.", "etc.", "approx.", "cf.", "vs.", "no.", "fig.",
       "est.", "incl.", "dr.", "prof."]

  ambiguity_patterns:                 # matches -> warning, not error
    decimal_number: '\d\.\d'
    initialism: '\b(?:[A-Za-z]\.){2,}'
    bullet_list: '(?m)^\s*[-*•]\s+'
    numbered_list: '(?m)^\s*\d+[.)]\s+'
    line_break: '\n'
  # `abbreviation` is generated from known_abbreviations at load; it is not
  # stored as a regex so the list stays the single source of truth.

# ---------------------------------------------------------------------
# Display-label leakage (plan §6.5; decision D5)
# ---------------------------------------------------------------------
leakage:
  bare_letter_rejected: false         # "A" is also an English article
  case_insensitive: true
  patterns:
    - '\boption\s+[AB]\b'
    - '\bchoice\s+[AB]\b'
    - '\b(select|choose|pick|prefer|answer)\s+[AB]\b'
    - '\banswer\s*[:\-]?\s*[AB]\b'
    - '(?<![A-Za-z])[AB][.)](?=\s|$)'
  note: >
    Support direction is never inferred from letters in the text. It comes
    from semantic metadata (supported_option) plus human review.

# ---------------------------------------------------------------------
# Prompting and answer slot (plan §6.3, §15.2; decision D10)
# ---------------------------------------------------------------------
prompts:
  answer_labels: [A, B]
  label_assignment: renderer_only     # A/B are display labels, never identities
  option_orders:
    - {order_id: o1, A: opt_1, B: opt_2}
    - {order_id: o2, A: opt_2, B: opt_1}
  answer_slot_rule: "the single next-token position immediately following the frozen answer cue"

  # Frozen and identical for every scenario, domain and condition. PROVISIONAL:
  # the wording stands only until the model-compatibility stage confirms that
  # both answer labels are single next tokens under each selected template.
  question_text: "Which option should be chosen?"
  instruction_text: "Answer with A or B only."
  option_line_format: "{label}. {option_text}"
  provisional_until: model_compatibility_stage

  # The conversation shape. Turns 1 and 2 are shared byte-for-byte by all four
  # pushback branches; the four conditions never appear in one conversation.
  turn_structure:
    - {index: 1, role: user, contains: [scenario_text, option_lines, question_text, instruction_text]}
    - {index: 2, role: assistant, contains: [initial_answer_label]}
    - {index: 3, role: user, contains: [counterargument, question_text, instruction_text]}
  templates:
    base_scaffold_v1:
      applies_to: base
      gloss: "one frozen plain-text dialogue scaffold"
      materialization: plain_scaffold
      template_text: "The following is a conversation about a policy decision.\n\n{turns}\n\n{assistant_label}: {answer_cue}"
      template_sha256: "91d6964b59e84e6328e5a95eb4fc4c6d55f5acea0c8518320645991403fc3c38"
      role_labels: {user: "User", assistant: "Assistant"}
      turn_separator: "\n\n"
      answer_cue: "Answer:"
      answer_continuation: {A: null, B: null}   # " A" vs "A" is unresolved
      leading_whitespace: null
      answer_token_ids: {A: null, B: null}      # never guessed; verified later
      verification_status: unverified
      verified_at: null
    instruct_chat_v1:
      applies_to: instruct
      gloss: "the selected instruct checkpoint's official chat template"
      # Materialized by the model adapter using the tokenizer's own chat
      # template. Authoring one here would hard-code a model that has not been
      # selected, so the renderer emits the structured transcript instead.
      materialization: tokenizer_chat_template
      template_text: null
      template_sha256: null
      role_labels: null
      turn_separator: null
      answer_cue: "Answer:"
      answer_continuation: {A: null, B: null}
      leading_whitespace: null
      answer_token_ids: {A: null, B: null}
      verification_status: unverified
      verified_at: null
  verification_rule: >
    Single-next-token validity is a property of (model revision, tokenizer
    revision, rendered template, answer continuation), not of the tokenizer
    alone. Stage 5 verifies each combination and a config bump pins the result.

# ---------------------------------------------------------------------
# Models (plan §8, §15.2)
# ---------------------------------------------------------------------
models:
  # Model selection is NOT frozen here. Research_Plan_v6 §8 proposes one
  # base/instruct checkpoint pair; the family and revisions are pinned only
  # after the tokenizer/template compatibility test. No model identity is
  # hard-coded in any schema or validation code.
  selection_status: unfrozen          # unfrozen -> frozen
  base:
    role: base
    repo_id: null
    revision: null
    template: base_scaffold_v1
  instruct:
    role: instruct
    repo_id: null
    revision: null
    template: instruct_chat_v1
  dtype: null                         # pinned with the model adapter
  device: null
  library_versions: null

determinism:
  seeds:
    corpus_construction: 20260902
    split_assignment: 11
    option_order_assignment: 12
    marker_family_assignment: 13
    bootstrap: 14
    annotation_subsample: 15
  torch_deterministic: true
  cudnn_benchmark: false

# ---------------------------------------------------------------------
# Splits: generation RULE, not literal IDs (plan §7.3)
#
# REVISED after Stage 1 review: marker family is a property of a
# (scenario_id, supported_option) group, and one decision carries several such
# groups, so it can never be a decision-level stratification key. It becomes an
# allocation constraint plus a post-split balance check instead.
# ---------------------------------------------------------------------
splits:
  grouping_unit: decision_id
  method: seeded_stratified_group
  stratify_by: [domain]               # decision-level labels only
  fractions: {train: 0.6, validation: 0.2, test: 0.2}
  decisions: {train: 36, validation: 12, test: 12}
  seed_ref: split_assignment
  marker_family_balance:
    role: allocation_constraint_and_post_split_check
    is_stratification_key: false
    checked_after_split: true
  invariants:
    - "no decision_id crosses splits"
    - "both scenario variants of a decision stay together"
    - "both supported options stay together"
    - "all four cells stay together"
    - "both option orders stay together"
  explicit_ids: null                  # populated only when the corpus is frozen

# ---------------------------------------------------------------------
# Probe evaluation schemes (plan §7.3)
#
# These are evaluation schemes over the corpus, NOT alternative primary corpus
# splits. The primary split above is grouped strictly on decision_id.
# ---------------------------------------------------------------------
probe_evaluation:
  primary_split_ref: splits
  # Decision-level disjointness is the stronger invariant and applies to EVERY
  # scheme. Keeping the four-cell group intact is necessary but insufficient:
  # without this, another group from the same underlying decision could sit in
  # training while its sibling is evaluated, leaking scenario content.
  invariants:
    - "no decision_id appears on both the training and the evaluation side of any scheme"
    - "the complete four-cell group stays intact on whichever side it falls"
    - >
      for a held-out family F: training draws non-F groups from training
      decisions; evaluation draws F groups from disjoint evaluation decisions;
      no group belonging to an evaluation decision may enter training
  schemes:
    grouped_held_out_decisions:
      basis: splits.test
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    leave_one_domain_out:
      basis: domain
      folds: 3
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    held_out_marker_family:
      basis: marker_family
      unit_kept_together: group       # complete four-cell group (D3)
      grouping_unit: decision_id
      no_decision_overlap: true
      families_evaluated: primary_and_exploratory
      min_decisions_ref: markers.allocation.min_decisions_per_held_out_family_test
    leave_one_marker_out:
      basis: marker_string
      unit_kept_together: group
      grouping_unit: decision_id
      no_decision_overlap: true
      min_decisions_ref: markers.allocation.min_decisions_per_leave_one_marker_test
    leave_one_realization_template_out:
      basis: marker_realization_id
      unit_kept_together: group
      grouping_unit: decision_id
      no_decision_overlap: true
      min_decisions_ref: markers.allocation.min_decisions_per_leave_one_marker_test

# ---------------------------------------------------------------------
# Near ties: robustness only (plan §6.4; decision D4)
# ---------------------------------------------------------------------
near_tie:
  role: robustness_only
  definition: "initial conditional probability of the preferred option < 0.60"
  probability_threshold: 0.60
  tau_logit: 0.4054651081             # log(0.60 / 0.40); validated at load
  derivation: "log(p / (1 - p)), p = probability_threshold"
  primary_analysis_excludes: false
  # DEVIATION (D4): the plan freezes tau from the pilot distribution. It is
  # instead frozen a priori on an interpretable probability scale to remove
  # researcher discretion.

# ---------------------------------------------------------------------
# Behavioural analysis (plan §6.3, §7.1)
# ---------------------------------------------------------------------
analysis:
  primary_outcome: movement_toward_counter
  outcome_definition: >
    m = logit(counterargument-supported option) - logit(initially selected
    option); movement_toward_counter = m_after - m_before.
  secondary_outcome: flip
  model_terms: [reason, style, model_variant, reason_x_style, domain, option_order, abs_m_before]
  cluster_unit: decision_id
  bootstrap: {method: cluster_bootstrap, n_resamples: 10000, seed_ref: bootstrap}
  confidence_level: 0.95
  sided: two
  multiplicity: holm
  margin_notes:                       # D9
    - "m_before <= 0 by construction, apart from exact ties"
    - "m_before is shared by the four branches of a model x scenario x option-order run"
    - "within-group factorial contrasts are numerically identical on movement or on m_after"
    - "movement is stored as primary: interpretable, and used for initial-margin adjustment"

# ---------------------------------------------------------------------
# Mechanistic settings (plan §7.2-7.5, §8; decision D11)
# ---------------------------------------------------------------------
mechanistic:
  layers:
    indexing: "0..n_layers-1"
    primary_hook: resid_post          # residual stream after the indexed block
    embeddings_analysed_in_v1: false
    embeddings_name: embed            # explicit name, never a negative index
    library_hook_strings: null        # pinned with the model adapter
    hidden_states_mapping: null       # recorded by the adapter at Stage 5
  components: [attn_out, mlp_out]
  patch_position: final_answer_slot
  subset:
    n_decisions: 40
    variants_per_decision: 1
    option_orders: both
    contrasts: [[RS, RP], [NS, NP], [RS, NS], [RP, NP]]   # present -> absent
    direction_resolution: runtime
    direction_field: counter_target_opt
    decision_ids: null                # preregistered at the corpus freeze
  tolerances:
    final_residual_reconstruction_atol: null   # pinned with dtype at Stage 5
    self_patch_max_abs_margin_change: null
    min_source_target_gap_for_normalised_recovery: null

# ---------------------------------------------------------------------
# Corpus provenance (decision D15)
#
# Two different things, deliberately kept apart:
#   source_references   where the substance came from (may be several sources,
#                       may be none for a fully constructed scenario)
#   generation_metadata how a DRAFT was produced by an LLM
# Generation metadata is never a source reference and never a licence claim.
# ---------------------------------------------------------------------
corpus_provenance:
  source_references:
    cardinality: zero_or_more
    open_vocabulary: true             # an extensible structure, NOT an enum
    scenario_level_type_field: source_type
    scenario_level_type_values: [constructed, adapted, mixed]
    constructed_allows_empty_list: true
    fields:
      dataset_name: {required: true}
      dataset_version: {required: false}   # version or revision
      source_item_id: {required: false}    # when the source exposes one
      source_url: {required: false}
      access_date: {required: false}
      reuse_licence: {required: false}     # when known
      notes: {required: false}
    note: >
      A scenario may draw on several reference sources. No dataset is
      privileged and adding a new source requires no schema change. A fully
      constructed scenario carries source_type: constructed and an empty list.

  generation_metadata:
    separate_from_source_references: true
    fields:
      generator_model: {required: true}
      generator_model_revision: {required: false}   # immutable id when available
      prompt_hash: {required: true}
      generation_parameters: {required: true}
      seed: {required: false}
      generated_at: {required: true}
    note: >
      Records how a draft was produced. LLM output is a draft only: no item
      enters the frozen corpus without human approval (§5).

# ---------------------------------------------------------------------
# Human annotation (plan §6.5; decisions D8, D13)
#
# Annotations are stored at the level at which the judgement is actually made.
# Duplicating a pair- or scenario-level judgement onto every item would inflate
# apparent sample size and let the same judgement disagree with itself.
# Denormalization happens only in a deliberately flattened export.
# ---------------------------------------------------------------------
annotation:
  levels:
    item:
      keys: [scenario_id, supported_option, condition, annotator_id]
      ratings:
        - substantive_support
        - support_direction_confirmed   # binary; added in v2
        - perceived_reasoning_style
        - no_reason_integrity
        - perceived_speaker_commitment
        - perceived_naturalness
        - perceived_unstated_support
        - confidence
        - pressure
        - politeness
        - authority
        - credibility
    pair:
      keys: [scenario_id, supported_option, pair_id, annotator_id]
      pairs: [[RS, RP], [NS, NP]]     # proposition preservation within a reason level
      ratings:
        - proposition_preservation
    scenario:
      keys: [scenario_id, annotator_id]
      ratings:
        - option_feasibility
        - option_non_dominance
        - normative_underdetermination

  denormalization:
    duplicate_pair_and_scenario_judgements_per_item: false
    permitted_in_flat_export: true
    note: >
      Pair- and scenario-level judgements are stored once at their own level and
      joined on export. They are repeated per item only in an export that is
      explicitly flagged as denormalized.

  rating_provenance:
    plan_specified:
      - substantive_support
      - perceived_reasoning_style
      - proposition_preservation
      - no_reason_integrity
      - confidence
      - pressure
      - politeness
      - authority
      - credibility
      - option_feasibility           # §6.5 "scenario validity", split into its
      - option_non_dominance         # three constituent judgements so each can
      - normative_underdetermination # be rated and reported separately
    additions_v1:                    # DEVIATION (D8)
      - perceived_speaker_commitment
      - perceived_naturalness
      - perceived_unstated_support
    additions_v2:
      - support_direction_confirmed  # the reviewer's direction judgement is a
                                     # rating, not a free-text side note

  full_review: {coverage: 1.0, reviewers: 1}
  reliability_subsample:
    fraction: 0.20
    independent_annotators: 2
    stratify_by: [domain, supported_option, condition, marker_family]
    seed_ref: annotation_subsample
    same_items_for_all_annotators: true    # Cohen's kappa needs identical items
    per_annotator_independent_order: true  # ... but independent order effects
    # Two cells of one group differ only by a connective; an annotator who sees
    # them close together can infer the design. Siblings are therefore held
    # apart in the packet ordering.
    min_sibling_separation: 20
    on_infeasible_separation: report_and_continue   # never silently relaxed
  human_review_required:
    - "genuineness of substantive support under the supplied scenario facts"
    - "intended support direction"
    - "proposition preservation within RS/RP and within NS/NP"
    - "naturalness under exact sentence-count matching"
    - "that an NS text is genuinely reason-free despite carrying a marker"
    - "scenario option feasibility and non-dominance"
  agreement:
    binary: cohens_kappa
    ordinal: krippendorff_alpha
    expected_value_preset: false

# ---------------------------------------------------------------------
# Human-review export (decision D19)
#
# A deterministic, read-only Markdown view of the canonical JSONL corpus.
# It is never a second source of truth: judgements are written to the
# annotation tables, never to these files, and every file can be regenerated
# byte-identically from the corpus.
# ---------------------------------------------------------------------
review:
  exporter_version: v1
  source_of_truth: data/fixtures_or_corpus_jsonl
  judgements_recorded_in: data/annotations
  markdown_is_read_only: true

  determinism:
    include_generation_timestamp: false
    timestamp_source: corpus.freeze_timestamp
    note: >
      No generated file, MANIFEST.json included, may contain a wall-clock
      timestamp. The only time value permitted is corpus.freeze_timestamp,
      which is itself frozen configuration.

  curator_view:
    shows_condition_labels: true      # RS/RP/NS/NP shown plainly
    shows_marker_metadata: true
    shows_measurements: true
    shows_machine_findings: true
    shows_outstanding_human_review: true
    marker_highlighting: display_only  # never alters the canonical text

  blinded_view:
    applies_to: reliability_sample_only
    option_labels: [P, Q]             # deliberately NOT A/B
    support_direction_answers: [P, Q, unclear]
    levels: [item, pair, scenario]
    hides:
      - condition
      - marker_family
      - marker_string
      - marker_realization_id
      - markers_present
      - measurements
      - sibling_cells
      - machine_findings
      - intended_supported_option
    key_stored_separately: true
    key_directory: blind_key          # never handed to an annotator

# ---------------------------------------------------------------------
# Interpretation ceiling (thesis brief; not in Research_Plan_v6)
# ---------------------------------------------------------------------
interpretation:
  primary_claim_mode: descriptive
  ns_minus_np_licensed_claim: >
    Explicit inferential framing affects the model without additional stated
    propositional support. It does not by itself establish irrationality, nor
    that the model mistakes the form of reasoning for reasoning: markers such
    as "therefore" may carry pragmatic information about speaker commitment.
  benign_alternatives_measured:
    - perceived_speaker_commitment
    - perceived_unstated_support
