      timeout_seconds: 300
      automatic_retries: 0
determinism:
  seeds:
    corpus_construction: 20260902
    split_assignment: 11
    option_order_assignment: 12
    marker_family_assignment: 13
    bootstrap: 14
    annotation_subsample: 15
  torch_deterministic: true
  cudnn_benchmark: false
splits:
  grouping_unit: decision_id
  method: seeded_stratified_group
  stratify_by:
  - domain
  fractions:
    train: 0.6
    validation: 0.2
    test: 0.2
  decisions:
    train: 36
    validation: 12
    test: 12
  seed_ref: split_assignment
  marker_family_balance:
    is_stratification_key: false
  explicit_ids: null
probe_evaluation:
  schemes:
    grouped_held_out_decisions:
      basis: splits.test
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    leave_one_domain_out:
      basis: domain
      folds: 3
      unit_kept_together: decision
      grouping_unit: decision_id
      no_decision_overlap: true
    held_out_marker_family:
      basis: marker_family
      unit_kept_together: group
      grouping_unit: decision_id
      no_decision_overlap: true
      families_evaluated:
      - conclusion_indicator
      - metadiscursive_inference
      min_decisions_ref: markers.allocation.min_decisions_per_held_out_family_test
      refused_families:
      - premise_indicator
      - concession_contrast
