  original_text: |-
    A regional planning office must decide whether to fast-track permits for new wind farms by shortening local consultation or keep the full consultation process for every wind farm. This decision comes after a recently permitted wind farm faced local protests. One option is to fast-track permits with a shortened consultation period, which could help address the growing queue of waiting projects. The other option is to maintain the full local consultation process for every wind farm, which could help prevent residents from feeling unheard, as shorter consultation might increase the risk of similar protests. Both approaches have implications for project timelines and community relations, and the choice must weigh these factors carefully.
