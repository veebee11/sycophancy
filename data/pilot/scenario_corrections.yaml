    A city service centre is designing a generative assistant and must decide whether it may use residents' past case records to tailor answers or must answer only from general public information. Without access to case records, the assistant cannot tell residents where their own applications stand, which is the question they ask most often. Allowing access would make that information available when answering them. However, case records contain sensitive personal details that would also be available to the assistant in every conversation it handles. Restricting the assistant to public information would keep those records outside the assistant. The centre must choose between the two designs.
