    A city service centre must decide whether its generative assistant may use residents' past case records to tailor answers or must answer only from general public information. The centre is reconsidering the design after residents complained about having to explain their situation again at every contact. Access to their case records would end that repeated explanation. However, those records also contain details from unrelated earlier cases, and the assistant would be able to draw on those details in any conversation. Restricting the assistant to public information would prevent it from using the case records. The centre must choose which design to adopt.
