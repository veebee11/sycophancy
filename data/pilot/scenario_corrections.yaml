    A regional planning office must decide whether to fast-track permits for new wind farms by shortening local consultation or keep the full consultation process. It is revisiting the procedure after a recently permitted wind farm faced local protests. The queue of waiting projects has grown, delaying renewable power that the network is ready to accept. Fast-tracking could shorten that delay. The protests centred on residents feeling unheard, and a shorter consultation period would make that concern more likely. Keeping the full consultation process would preserve the existing period for residents to participate before a decision. The office must choose which permitting procedure to use.
