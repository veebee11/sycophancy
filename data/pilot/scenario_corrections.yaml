    A regional transport agency must decide whether to bring forward a stricter emissions limit for newly registered cars or keep the limit on its current schedule. The agency is setting the timetable while carmakers are finalising their next model ranges. Introducing the stricter limit ahead of schedule would remove the most polluting new models from sale while the fleet is being renewed. Keeping the current schedule would leave more time before the stricter limit applies. Cars that meet the stricter limit still cost noticeably more than current models, putting them beyond many first-time buyers. The choice concerns when the stricter limit should take effect.
