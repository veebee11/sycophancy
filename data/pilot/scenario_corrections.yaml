  corrected_text: |-
    A national energy regulator must decide whether the electricity network operator may own and run battery storage or must buy storage services from independent providers. The regulator is setting the rules as battery storage is first connected to the network. Allowing the operator to own storage would let it place batteries exactly where congestion occurs without waiting for a provider to come forward. Requiring it to buy storage services would instead keep ownership with independent providers. If the operator owned batteries, those providers would be competing with the company that controls their network access. The regulator must choose between these two arrangements.
