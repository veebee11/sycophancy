    options:
      opt_1: "Fast-track wind-farm permits with a shortened consultation period."
      opt_2: "Keep the full local consultation process for every wind farm."
    competing_goals:
      opt_1: "faster growth of renewable power"
      opt_2: "meaningful participation of affected communities"
    why_underdetermined: "Both procedures are lawful and administratively workable, and no rule states whether faster renewable growth should outweigh fuller community participation."
    variants:
      v1:
        context: "The region sets its permitting procedure for the next round of wind projects."
        scenario_facts:
          opt_1: ["Several completed wind-farm designs are waiting for permits while the region still relies on fossil power."]
          opt_2: ["Residents near proposed sites would have less time to raise concerns about noise and landscape before a decision."]
      v2:
        context: "The region revisits the procedure after a recently permitted wind farm faced local protests."
        scenario_facts:
          opt_1: ["The queue of waiting projects has grown, delaying renewable power that the network is ready to accept."]
          opt_2: ["The protests centred on residents feeling unheard, which a shorter consultation would make more likely."]
    source_references:
