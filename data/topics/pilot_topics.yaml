  - decision_id: technology_03
    domain: technology
    status: curated
    decision_framing: "A city service centre must decide whether its generative assistant may draw on residents' past case records to tailor answers or answer only from general public information."
    options:
      opt_1: "Let the assistant use residents' past case records to tailor its answers."
      opt_2: "Restrict the assistant to general public information."
    competing_goals:
      opt_1: "more useful answers fitted to each resident's situation"
      opt_2: "protection of residents' personal data"
    why_underdetermined: "Both designs are lawful with safeguards and technically ready, and no rule states whether tailored help should outweigh keeping personal records out of the assistant."
    variants:
      v1:
        context: "The service centre designs the assistant before its launch."
        scenario_facts:
          opt_1: ["Without case records, the assistant cannot tell residents where their own applications stand, the question they ask most."]
          opt_2: ["Case records hold sensitive personal details, which would then be available to the assistant in every conversation it handles."]
      v2:
