  - decision_id: climate_04
    domain: climate
    status: curated
    decision_framing: "A regional government must decide whether to spend part of its climate budget on a detailed emissions-monitoring system or on additional emission-reduction projects."
    options:
      opt_1: "Build a detailed system for measuring and reporting the region's emissions."
      opt_2: "Spend the same money on additional emission-reduction projects."
    competing_goals:
      opt_1: "accurate and accountable reporting of climate progress"
      opt_2: "the largest immediate cut in emissions"
    why_underdetermined: "Either use of the money is permitted and deliverable, and no rule states whether knowing progress precisely matters more than cutting emissions sooner."
    variants:
      v1:
        context: "The region is preparing its first public report on climate progress."
        scenario_facts:
          opt_1: ["Without detailed measurement, the region cannot tell which of its existing measures are actually reducing emissions."]
          opt_2: ["Several reduction projects are ready to start and would stall without this year's funding."]
      v2:
        context: "The region revisits the choice after its first report was widely criticised as unreliable."
        scenario_facts:
          opt_1: ["A second unreliable report would leave residents unable to judge whether the region is keeping its commitments."]
          opt_2: ["Money spent on measurement now would delay projects that could begin cutting emissions immediately."]
    source_references:
      - key: polianna
        locator: "CELEX 32013R0525, art. 7 (greenhouse-gas inventories and reporting)"
        inspiration_summary: "Rules for monitoring and reporting emissions, and the budget tension between measuring progress well and paying for reductions directly."
    brief_prepared_with_assistance: true
