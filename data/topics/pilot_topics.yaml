  - decision_id: energy_04
    domain: energy
    status: rejected
    decision_framing: "A national energy ministry must decide whether to require energy suppliers to deliver efficiency savings among their customers or to fund savings through a public programme."
    options:
      opt_1: "Oblige energy suppliers to deliver a set level of efficiency savings among their customers."
      opt_2: "Fund efficiency savings through a public programme paid from general taxation."
    competing_goals:
      opt_1: "certainty that the savings are actually delivered"
      opt_2: "keeping extra costs off household energy bills"
    why_underdetermined: "Both schemes are legally available and can reach the same households, and no rule states whether assured delivery matters more than keeping costs off energy bills."
    variants:
      v1:
        context: "The ministry chooses how a new efficiency scheme will be delivered."
        scenario_facts:
          opt_1: ["Suppliers that fall short face penalties, so the required savings are delivered even when public budgets tighten."]
          opt_2: ["Suppliers recover the cost of an obligation through energy bills, which weigh most heavily on low-income households."]
      v2:
        context: "The ministry revisits the choice after energy prices rose steeply."
        scenario_facts:
          opt_1: ["Public efficiency programmes have been cut in past budget crises, leaving planned savings undelivered."]
          opt_2: ["With prices already high, adding obligation costs to bills would push more households into energy poverty."]
    source_references:
