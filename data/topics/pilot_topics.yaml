  - decision_id: technology_02
    domain: technology
    status: curated
    decision_framing: "A national agency must decide whether to disclose generative AI involvement on every text it sends to the public or only on texts sent without human editing."
    options:
      opt_1: "Disclose generative AI involvement on every public text it contributed to."
      opt_2: "Disclose it only on texts sent without human editing."
    competing_goals:
      opt_1: "the public's right to know how official texts are produced"
      opt_2: "clear, uncluttered messages that people actually read"
    why_underdetermined: "Both policies are lawful and easy to implement, and no rule states whether complete disclosure matters more than keeping official messages clear and readable."
    variants:
      v1:
        context: "The agency sets its disclosure policy before using generative AI in public messages."
        scenario_facts:
          opt_1: ["Recipients cannot tell from a finished text whether an assistant helped write it, and only a label on it would tell them."]
          opt_2: ["Labels on routine edited texts would crowd out the information recipients need to act on."]
      v2:
        context: "The agency revisits the policy after most of its texts began passing through the assistant."
        scenario_facts:
          opt_1: ["With most texts now machine-assisted, labelling only unedited ones would hide how common its use has become."]
          opt_2: ["Putting the same label on nearly every text would lengthen routine messages and make the information recipients need harder to find."]
    source_references:
      - key: genai4pa_jrc_2025
        locator: "Annex I principle: transparency"
        inspiration_summary: "Public-sector guidance on generative AI that stresses openness, and how far disclosing its use should extend."
