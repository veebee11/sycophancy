  - decision_id: climate_05
    domain: climate
    status: curated
    decision_framing: "A regional government must decide whether its interim climate goal should bind each economic sector separately or apply as a single goal across all sectors."
    options:
      opt_1: "Set a separate binding interim goal for each sector."
      opt_2: "Set a single interim goal that sectors can meet in any combination."
    competing_goals:
      opt_1: "certainty that every sector contributes its share"
      opt_2: "flexibility to cut emissions wherever it costs least"
    why_underdetermined: "Both designs are legally available and administratively workable, and no rule states whether assured contributions from every sector outweigh a lower overall cost."
    variants:
      v1:
        context: "The government sets an interim goal for the first time."
        scenario_facts:
          opt_1: ["A single goal obliges no sector in particular, so the hardest sectors can postpone action while others make up the difference."]
          opt_2: ["Some sectors can cut emissions far more cheaply than others, and a single goal lets the cheapest cuts come first."]
      v2:
        context: "The government revisits the design after one sector missed its informal milestone."
        scenario_facts:
          opt_1: ["Under a single goal, the lagging sector would face no firm obligation to catch up."]
          opt_2: ["Forcing the lagging sector to catch up alone would cost far more than making the same cuts elsewhere."]
    source_references:
      - key: polianna
        locator: "CELEX 32018R1999, art. 4 (national objectives and targets)"
        inspiration_summary: "Governance of climate objectives across sectors, and whether targets should bind each sector or allow flexibility between them."
