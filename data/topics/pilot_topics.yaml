      curated_by: "Vidhi Bhutani"
      curated_at: 2026-09-14

  - decision_id: energy_02
    domain: energy
    status: curated
    decision_framing: "An electricity regulator must decide whether households should be placed on time-varying prices by default or stay on flat prices unless they choose otherwise."
    options:
      opt_1: "Place households on time-varying prices by default, with an option to switch back."
      opt_2: "Keep households on flat prices by default, with time-varying prices available on request."
    competing_goals:
      opt_1: "efficient use of the network by shifting demand away from peaks"
      opt_2: "predictable household electricity bills"
    why_underdetermined: "Both defaults work with the meters already installed, and no rule states whether efficient network use matters more than bill predictability for households."
    variants:
      v1:
        context: "The regulator sets the default as smart meters reach most homes."
        scenario_facts:
          opt_1: ["Most households keep their default tariff, so a time-varying default would shift more evening use than an opt-in scheme."]
          opt_2: ["Under time-varying prices, a cold week can produce a bill far higher than the household expected."]
      v2:
        context: "The regulator revisits the default after evening peaks began requiring costly emergency generation."
        scenario_facts:
          opt_1: ["Moving even part of evening demand would avoid switching on the emergency generators."]
          opt_2: ["Households whose essential electricity use falls in the evening peak cannot move it, and would face less predictable bills without any saving."]
    source_references:
      - key: polianna
        locator: "CELEX 32019L0944, art. 11 (dynamic electricity price contracts)"
        inspiration_summary: "Consumer rights around dynamic electricity pricing, and the tension between flexible demand and predictable bills."
    brief_prepared_with_assistance: true
    curation:
