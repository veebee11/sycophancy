  # ============================================================= technology

  - decision_id: technology_01
    domain: technology
    status: curated
    decision_framing: "A city permit office must decide whether its generative assistant may approve simple permit renewals on its own or only prepare them for a staff member to approve."
    options:
      opt_1: "Let the assistant approve simple renewals without staff sign-off."
      opt_2: "Have the assistant prepare renewals, with a staff member approving each one."
    competing_goals:
      opt_1: "faster service for residents"
      opt_2: "a named official answerable for every decision"
    why_underdetermined: "Both arrangements are lawful for simple renewals and within budget, and no rule states whether faster service should outweigh having an accountable official for each decision."
    variants:
      v1:
        context: "The office sets the arrangement before launching the assistant."
        scenario_facts:
          opt_1: ["Residents currently wait weeks for renewals that involve no judgement beyond checking a few details."]
          opt_2: ["Under the office's rules, only the official who signs a renewal can later be asked to explain or correct it."]
      v2:
        context: "The office revisits the arrangement after a trial in a single district."
        scenario_facts:
          opt_1: ["During the trial, staff approved almost every renewal the assistant prepared without changing anything."]
          opt_2: ["When staff changed a renewal, the approving official remained responsible for explaining the correction to the resident."]
    source_references:
      - key: genai4pa_jrc_2025
        locator: "Annex II process type: public services and engagement; Annex I principle: accountability"
        inspiration_summary: "Public administrations using generative AI in services for residents, and guidance on who is accountable for what it produces."
