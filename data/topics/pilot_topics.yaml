  # ================================================================= energy

  - decision_id: energy_01
    domain: energy
    status: curated
    decision_framing: "A national energy regulator must decide whether the electricity network operator may own and run battery storage or must buy storage services from market providers."
    options:
      opt_1: "Allow the network operator to own and run its own battery storage."
      opt_2: "Require the network operator to buy storage services from independent providers."
    competing_goals:
      opt_1: "fast and dependable support for network stability"
      opt_2: "fair competition in the storage market"
    why_underdetermined: "Both arrangements are technically sound and permitted in principle, and no rule states whether dependable network support should outweigh open competition."
    variants:
      v1:
        context: "The regulator sets the rules as battery storage is first connected to the network."
        scenario_facts:
          opt_1: ["The operator could place batteries exactly where congestion occurs, without waiting for a provider to come forward."]
          opt_2: ["If the operator owns batteries, independent providers would be competing with the company that controls their network access."]
      v2:
        context: "The regulator revisits the rules after a tender for storage services attracted few bidders."
        scenario_facts:
          opt_1: ["With few bidders, relying on the market could leave congested parts of the network without storage support."]
          opt_2: ["Letting the operator step in now could deter the new providers who are preparing to enter the market."]
    source_references:
      - key: polianna
        locator: "CELEX 32019L0944, arts. 36 and 54 (storage ownership by network operators)"
        inspiration_summary: "Electricity-market rules on who may own and operate storage, weighing network reliability against a competitive market."
    brief_prepared_with_assistance: true
    curation:
