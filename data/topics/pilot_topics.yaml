  - decision_id: energy_05
    domain: energy
    status: curated
    decision_framing: "A transport ministry must decide whether to spend its charging budget first on fast chargers along main highways or on slower chargers in dense residential streets."
    options:
      opt_1: "Build fast chargers along the main highways first."
      opt_2: "Build slower chargers in dense residential streets first."
    competing_goals:
      opt_1: "making long-distance electric travel practical"
      opt_2: "access to charging for residents without private parking"
    why_underdetermined: "Both programmes fit the budget and can be built quickly, and no rule states whether long-distance coverage matters more than access for residents without driveways."
    variants:
      v1:
        context: "The ministry allocates its first charging budget."
        scenario_facts:
          opt_1: ["Gaps between highway chargers are the main reason drivers in the region hesitate to buy an electric car."]
          opt_2: ["Residents without private parking have no practical way to charge overnight, so electric cars are out of reach for them."]
      v2:
        context: "The ministry revisits the allocation after private companies began building highway chargers on their own."
        scenario_facts:
          opt_1: ["Private highway chargers cover only the busiest routes, leaving long rural stretches without any charging."]
          opt_2: ["Private companies show no interest in residential streets, so those residents depend entirely on public chargers."]
    source_references:
