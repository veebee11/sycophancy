# Full topic bank, v2 — 60 curated decisions, 20 per domain.
#
# The twelve curated pilot decisions and the three rejected pilot candidates
# are carried over from data/topics/pilot_topics.yaml byte for byte: each
# record's text is identical, and they keep their curation (Vidhi Bhutani,
# 2026-09-14). They are the seed of the full corpus and are not re-drafted.
#
# The 48 decisions added here (climate_06-21, energy_06-21, technology_06-21)
# were drafted with assistance and reviewed by the curator, Vidhi Bhutani, who
# recorded all nine judgements as true for each on 2026-09-21, after reviewing
# the decisions, options, goals, variants, facts, overlap notes and the
# context-tilt audit. Curation does not unblock generation: the full
# configuration's generation block stays in place until it is lifted
# deliberately.
#
# Sources are recorded, as in the pilot bank, only as a registry key, a locator
# and an inspiration summary; no source wording, real law, place, organisation
# or statistic appears in any brief. The climate additions cite the three
# consolidated EUR-Lex acts added to the registry on 2026-09-21. Their reuse
# terms (CC BY 4.0, seed-only, attribution required) were confirmed by Vidhi
# Bhutani on 2026-09-21, and they are recorded as citable.
#
# IDs climate_03, energy_04 and technology_05 belong to the rejected pilot
# candidates and are not reused.
#
# A source supplies only the underlying mechanism. Each two-option decision,
# and the trade-off it poses, is constructed for this study; no source is
# claimed to offer either option as such.
#
# Facts follow the pilot rule: each side's consideration comparably concrete,
# and neutral descriptions of who bears a cost or benefit instead of identity
# appeals.

topics:

  # ================================================================ climate

  - decision_id: climate_01
    domain: climate
    status: curated
    decision_framing: "A regional transport agency must decide whether to bring forward a stricter emissions limit for newly registered cars or keep the limit on its current schedule."
    options:
      opt_1: "Introduce the stricter emissions limit ahead of schedule."
      opt_2: "Keep the stricter emissions limit on its current schedule."
    competing_goals:
      opt_1: "faster cuts in road-transport emissions"
      opt_2: "keeping new cars affordable for ordinary buyers"
    why_underdetermined: "Both timetables are legally possible and technically achievable, and no rule states how quickly transport emissions must fall relative to the cost borne by car buyers."
    variants:
      v1:
        context: "The agency sets the timetable while carmakers are finalising their next model ranges."
        scenario_facts:
          opt_1: ["An earlier limit would remove the most polluting new models from sale while the fleet is being renewed."]
          opt_2: ["Cars meeting the stricter limit still cost noticeably more than current models, putting them beyond many first-time buyers."]
      v2:
        context: "The agency revisits the timetable after a sharp rise in the price of used cars."
        scenario_facts:
          opt_1: ["Road-transport emissions have fallen more slowly than planned, and an earlier limit would cut them sooner than the agency's other measures."]
          opt_2: ["With used cars already expensive, dearer new cars would leave lower-income households without an affordable way to replace an ageing car."]
    source_references:
      - key: polianna
        locator: "CELEX 32019R0631, art. 1 (emission standards for new cars and vans)"
        inspiration_summary: "Fleet-wide emission standards for new vehicles, and the tension between tightening them quickly and the cost that reaches buyers."
    brief_prepared_with_assistance: true
    curation:
      underdetermined: true
      can_be_made_self_contained: true
      no_party_politician_or_identity_framing: true
      options_feasible_and_non_dominated: true
      each_fact_supports_its_option: true
      both_goals_represented_in_every_variant: true
      no_option_dominates_given_the_facts: true
      variants_differ_substantively: true
      no_source_wording_in_brief: true
      curated_by: "Vidhi Bhutani"
      curated_at: 2026-09-14

  - decision_id: climate_02
    domain: climate
    status: curated
    decision_framing: "A regional emissions-trading scheme must decide whether to start charging for the emissions of departing flights now or wait for a planned agreement among many countries."
    options:
      opt_1: "Start covering departing flights under the regional scheme now."
      opt_2: "Wait for the wider multi-country agreement before covering flights."
    competing_goals:
      opt_1: "putting a carbon price on flight emissions without delay"
      opt_2: "keeping partner countries committed to a shared international approach"
    why_underdetermined: "Both courses are lawful and administratively workable, and nothing settles whether immediate coverage matters more than preserving the chance of a broader agreement."
    variants:
      v1:
        context: "Negotiations on the multi-country agreement are at an early stage."
        scenario_facts:
          opt_1: ["Every season without coverage leaves a growing source of emissions outside any carbon price."]
          opt_2: ["Partner countries have told the region's negotiators that unilateral coverage would make them less willing to join."]
      v2:
        context: "Negotiators have agreed an outline, but its start date remains uncertain."
        scenario_facts:
          opt_1: ["The outline sets no start date, so flights stay outside any carbon price for as long as it is negotiated."]
          opt_2: ["Partner countries are ready to sign the outline, and acting alone now would reopen the points already settled."]
    source_references:
      - key: polianna
        locator: "CELEX 32014R0421, art. 1 (aviation deferral pending an international measure)"
        inspiration_summary: "Whether to price aviation emissions regionally or hold back so that a broader international arrangement can take shape."
    brief_prepared_with_assistance: true
    curation:
