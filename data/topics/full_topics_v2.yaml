    decision_framing: "A regional government must decide whether to spend the money raised by selling emission allowances on rebates for households or on projects that cut emissions."
    options:
      opt_1: "Return the revenue to households as direct rebates."
      opt_2: "Invest the revenue in projects that cut emissions."
    competing_goals:
      opt_1: "protecting household budgets from higher energy and fuel costs"
      opt_2: "the largest additional cut in emissions"
    why_underdetermined: "Both uses are lawful and popular with different groups, and nothing states whether easing living costs or funding further cuts should come first."
    variants:
      v1:
        context: "Allowance revenue is being held in a temporary fund while its permanent use is decided."
        scenario_facts:
          opt_1: ["Higher allowance prices pass through into fuel and heating bills that weigh most on lower-income households."]
          opt_2: ["Funding low-carbon projects could cut emissions further than the carbon price alone would achieve."]
      v2:
        context: "The government is preparing its budget after a year of strong allowance sales."
        scenario_facts:
          opt_1: ["Visible rebates could sustain public support for keeping the carbon price in place."]
          opt_2: ["Revenue spent on rebates is no longer available for insulation, clean transport or other emission-cutting projects."]
    source_references:
