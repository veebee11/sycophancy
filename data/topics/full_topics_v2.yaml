  - decision_id: climate_06
    domain: climate
    status: curated
    decision_framing: "A regional emissions-trading scheme must decide whether to keep giving free emission allowances to heavy industry that competes with overseas producers or to make those firms buy every allowance."
    options:
      opt_1: "Keep giving free allowances to trade-exposed heavy industry."
      opt_2: "Require trade-exposed heavy industry to buy every allowance it uses."
    competing_goals:
      opt_1: "keeping production and jobs from moving to places with no carbon price"
      opt_2: "making polluters pay the full cost of their emissions"
    why_underdetermined: "Both approaches are workable, and nothing settles how much risk of production moving abroad should be accepted in exchange for a stronger price signal."
    variants:
      v1:
        context: "The scheme is preparing its first allocation rules for heavy industry."
        scenario_facts:
          opt_1: ["Firms facing competitors with no carbon price could move production abroad, where the same emissions would continue unpriced."]
          opt_2: ["Free allowances spare these firms the cost of their emissions, a cost other covered emitters bear in full."]
      v2:
        context: "The scheme is reviewing free allocation ahead of its next trading period."
        scenario_facts:
          opt_1: ["Charging firms in full could lead some plants to close, with the lost output replaced by imports."]
          opt_2: ["Some firms received more free allowances than they needed and sold the surplus at a profit."]
    source_references:
      - key: eurlex_ets_directive
        locator: "CELEX 02003L0087-20240301, arts. 10a and 10b (free allocation, carbon leakage)"
        inspiration_summary: "Free allocation to trade-exposed industry in emissions trading. The source supplies the mechanism; the decision weighing industrial competitiveness and leakage protection against the polluter-pays price signal is constructed for this study."
