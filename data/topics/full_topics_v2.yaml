      opt_1: "Share the fund mainly among lower-income areas."
      opt_2: "Direct the fund wherever emissions can be cut most cheaply."
    competing_goals:
      opt_1: "a fair transition for areas with the least means to invest"
      opt_2: "the greatest emission cut for each unit of money spent"
