  - decision_id: climate_08
    domain: climate
    status: curated
    decision_framing: "A regional emissions-trading scheme must decide whether to release extra allowances automatically when prices spike or to leave the price to the market."
    options:
      opt_1: "Release extra allowances automatically when prices spike."
      opt_2: "Leave the allowance price to the market without intervention."
    competing_goals:
      opt_1: "price stability that lets businesses plan their investments"
      opt_2: "an undiluted scarcity signal that drives emission cuts"
    why_underdetermined: "Both designs are used in practice, and no rule fixes how much price volatility should be tolerated for the sake of a strong signal."
    variants:
      v1:
        context: "The scheme is reviewing its rules for periods of rapid price change."
        scenario_facts:
          opt_1: ["Sudden price spikes make it hard for firms to judge whether a low-carbon investment will pay off."]
          opt_2: ["Releasing extra allowances during a spike adds supply and weakens the pressure on emitters to cut."]
      v2:
        context: "The scheme is reconsidering its market rules as part of a scheduled review."
        scenario_facts:
          opt_1: ["An automatic release could calm prices before temporary shortages damage firms that cannot adjust quickly."]
          opt_2: ["Leaving a high price in place keeps a strong incentive for firms to invest in cutting their emissions."]
    source_references:
      - key: eurlex_ets_directive
        locator: "CELEX 02003L0087-20240301, art. 29a (measures on excessive price fluctuations)"
        inspiration_summary: "Price-intervention mechanism in emissions trading. The source supplies the mechanism; the decision weighing price predictability for investors against the strength of the scarcity signal is constructed for this study."
