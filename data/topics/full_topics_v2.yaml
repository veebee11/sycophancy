    status: rejected
    decision_framing: "A city must decide whether to make landlords bring rented homes up to a minimum efficiency level or to rely on voluntary renovation grants."
    options:
      opt_1: "Require landlords to meet a minimum energy-performance standard before re-letting a home."
      opt_2: "Offer landlords renovation grants without imposing a minimum standard."
    competing_goals:
      opt_1: "assured emission cuts across rented housing"
      opt_2: "protecting tenants from rent rises and losing their homes"
    why_underdetermined: "Both approaches are affordable for the city and legally available, and no rule states whether emission cuts in housing should outweigh tenants' security."
    variants:
      v1:
        context: "The city designs the housing section of its climate plan."
        scenario_facts:
          opt_1: ["A standard would reach the least efficient rented homes, which account for most of the housing sector's emissions."]
          opt_2: ["Landlords facing required upgrades would be allowed to pass the cost on to tenants through higher rents."]
      v2:
        context: "The city revisits the plan after a shortage of rental homes has worsened."
        scenario_facts:
          opt_1: ["Without a standard, the least efficient rented homes would stay unimproved for decades, locking in their emissions."]
          opt_2: ["With rental homes scarce, landlords facing required upgrades could withdraw homes from letting and deepen the shortage."]
    source_references:
      - key: polianna
        locator: "CELEX 32018L0844, art. 1 (building energy-performance amendments)"
        inspiration_summary: "Energy-performance requirements for buildings, and whether to mandate upgrades or encourage them when owners can pass costs to occupants."
