          opt_2: ["Some cheaper reduction opportunities lie in wealthier areas that would receive less under a needs-based rule."]
      v2:
        context: "The fund is reviewing its rules after its first funding round."
        scenario_facts:
          opt_1: ["Without dedicated support, areas with the least money could fall further behind in cutting emissions."]
          opt_2: ["Spending where cuts cost least would lower total emissions more with the same budget."]
