  - decision_id: climate_11
    domain: climate
    status: curated
    decision_framing: "A regional emissions-trading scheme must decide whether to let small emitters leave the scheme under simpler national measures or to keep every covered installation inside it."
    options:
      opt_1: "Let small emitters leave the scheme under simpler national measures."
      opt_2: "Keep every covered installation inside the scheme."
    competing_goals:
      opt_1: "sparing small operators paperwork out of proportion to their emissions"
      opt_2: "a single carbon price applied equally to every covered emitter"
    why_underdetermined: "Both approaches have been used, and nothing states how much administrative relief justifies treating emitters differently."
    variants:
      v1:
        context: "The scheme is reviewing which installations it covers."
        scenario_facts:
          opt_1: ["For a small installation, the cost of monitoring and verification can be large relative to its carbon bill."]
          opt_2: ["Excluding small emitters means their emissions face a different, and possibly weaker, set of rules."]
      v2:
        context: "The scheme is updating its rules as part of a wider review."
        scenario_facts:
          opt_1: ["Simpler national measures could still cut small emitters' emissions without the full trading apparatus."]
          opt_2: ["A uniform price lets small and large emitters compete on the same terms for cutting emissions."]
    source_references:
