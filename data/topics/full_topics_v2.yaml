  - decision_id: climate_10
    domain: climate
    status: curated
    decision_framing: "A regional emissions-trading scheme must decide whether to cover the emissions of whole voyages to and from outside ports or only voyages within the region."
    options:
      opt_1: "Cover whole voyages to and from outside ports."
      opt_2: "Cover only voyages within the region."
    competing_goals:
      opt_1: "capturing as much of shipping's climate impact as possible"
      opt_2: "avoiding ships rerouting to outside ports to escape the charge"
    why_underdetermined: "Both scopes are defensible, and no rule settles how much coverage is worth the risk of ships changing routes."
    variants:
      v1:
        context: "The scheme is extending carbon pricing to shipping for the first time."
        scenario_facts:
          opt_1: ["Most of the emissions from ships calling at regional ports occur on long voyages to and from outside ports."]
          opt_2: ["Ships could add a stop at a nearby outside port so that only a short final leg falls under the charge."]
      v2:
        context: "The scheme is reviewing its shipping rules after their first year."
        scenario_facts:
          opt_1: ["Covering only short internal voyages would leave the largest shipping emissions unpriced."]
          opt_2: ["A wide scope could divert traffic and business away from regional ports towards competitors outside it."]
    source_references:
      - key: eurlex_ets_directive
        locator: "CELEX 02003L0087-20240301, art. 3ga (scope for maritime transport)"
        inspiration_summary: "Geographic scope of shipping emissions in emissions trading. The source supplies the mechanism; the decision weighing environmental coverage against evasion through rerouting and loss of port business is constructed for this study."
