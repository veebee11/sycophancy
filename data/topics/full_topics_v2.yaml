  - decision_id: climate_09
    domain: climate
    status: curated
    decision_framing: "A regional authority extending carbon pricing to heating and road fuels must decide whether to place the obligation on fuel suppliers or on large distributors and commercial users, with household fuel charged through ordinary bills."
    options:
      opt_1: "Place the obligation on fuel suppliers when fuel enters the market."
      opt_2: "Place the obligation on large distributors and commercial users, charging households through their ordinary fuel bills."
    competing_goals:
      opt_1: "broad coverage through a small number of obligated companies"
      opt_2: "responsibility and the carbon charge placed closer to where fuel is used"
    why_underdetermined: "Both points of obligation can be administered at the same carbon price, and nothing settles whether broad, simple coverage or visible downstream responsibility matters more."
    variants:
      v1:
        context: "The authority is designing the scheme before it takes effect."
        scenario_facts:
          opt_1: ["A small number of fuel suppliers already report the fuel they sell, so nearly all fuel is covered from the start."]
          opt_2: ["Commercial users that hold the obligation see the carbon charge on their own accounts and can plan how to reduce it."]
      v2:
        context: "The authority is revisiting the design ahead of the scheme's second year."
        scenario_facts:
          opt_1: ["Obligating suppliers avoids registering and checking many separate distributors and commercial users."]
          opt_2: ["Charging households through their distributor's bills lets the carbon cost appear as its own line rather than inside the fuel price."]
    source_references:
      - key: eurlex_ets_directive
        locator: "CELEX 02003L0087-20240301, art. 3(ae) and Chapter IVa (regulated entity for fuels)"
        inspiration_summary: "Point of obligation for fuel emissions in emissions trading. The source supplies the mechanism; the decision weighing broad administrative coverage against responsibility and visibility closer to fuel use is constructed for this study."
    brief_prepared_with_assistance: true
    curation:
