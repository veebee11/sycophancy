# A separate, additive paid-call authorisation for exactly one stage: the
# INITIAL draft of the 192 new full-v2 groups -- two supported-option groups
# (opt_1, opt_2) for each of the 96 approved new scenarios, one call per
# group, four generated cells (RS, RP, NS, NP) per call, 768 new texts.
#
# This file is NOT part of configs/frozen/v2_full.yaml, and loading or
# checking it never computes or edits that configuration's content hash.
# The frozen configuration's own corpus.generation_authorization covers only
# scope: scenario_stage_initial_only (the 96 initial scenario calls) and
# names "group drafting" among its excludes. Recording a group-stage
# authorisation inside that block would edit the frozen file, change its
# content hash 7548650b42e7cb7407f521d10d9e8c2d4f9f25b5074d98cc523b4a5e35a99c94,
# and stale every one of the 96 scenario approvals bound to that exact hash
# (see docs/design_notes.md, "Separate stage authorisations"). This record
# exists so that never has to happen: a later stage gets its own small,
# separately reviewed record, named by kind, instead -- the same mechanism
# already used, authorised and spent for the two scenario redrafts
# (data/full/authorizations/scenario_redraft_v1.yaml).
#
# `scripts/pilot.py groups --stage-authorization <this file>` checks every
# field below against the CURRENT configuration, the CURRENT approvals file
# and the frozen marker allocation before any credential is read or backend
# is built (reasonstyle.generation.stage_authorization.
# group_stage_authorization_problems). A record whose status is not exactly
# 'authorized' authorises nothing.
#
# Deliberately excluded from this record's scope, each needing its own
# separate authorisation: repairs (a group that is not machine-valid on its
# one initial call is `needs_manual_review`, not retried here), scenario
# calls of any kind, any group outside the 192 named targets, the 48
# imported pilot groups (read-only, never regenerated), behavioural
# evaluation and mechanistic analysis.

