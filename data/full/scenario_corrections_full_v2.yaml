- approval_state: approved
  corrected_text: A regional emissions-trading scheme is extending carbon pricing
    to shipping for the first time and must decide how to treat voyages involving
    ports outside the region. It could cover the emissions of whole voyages to and
    from outside ports, reflecting that most emissions from ships calling at regional
    ports occur on long voyages to and from those ports. Alternatively, it could cover
    only the emissions of voyages within the region, reflecting that under whole-voyage
    coverage ships could add a stop at a nearby outside port so that only a short
    final leg falls under the charge. The decision is whether the scheme should apply
    carbon pricing to whole external voyages or limit its coverage to voyages within
    the region.
  corrected_text_sha256: ca9e766b9fe9af951e6c2a3a9fe1bedebede9a9be08797b2bbc44f371479fc19
