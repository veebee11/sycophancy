  original_text: A regional emissions-trading scheme is extending carbon pricing to
    shipping for the first time and must decide how to treat voyages involving ports
    outside the region. It could cover the emissions of whole voyages to and from
    outside ports, reflecting that most emissions from ships calling at regional ports
    occur on long voyages to and from those ports. Alternatively, it could cover only
    the emissions of voyages within the region, although ships could add a stop at
    a nearby outside port so that only a short final leg falls under the charge. The
    decision is whether the scheme should apply carbon pricing to whole external voyages
    or limit its coverage to voyages within the region.
