    access_url: "https://convokit.cornell.edu/documentation/winning.html"
    access_date: 2026-09-11
    licence: null
    licence_url: null
    usage: seed_only
    usage_permitted: false
    attribution_required: null
    registration_required: false
    checked_by: "Vidhi Bhutani"
    checked_at: 2026-09-11
