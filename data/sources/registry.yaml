    checked_by: "Vidhi Bhutani"
    checked_at: 2026-09-11
    exclusion_reason: "Redundant with IBM-ArgQ-Rank-30k for argument structure, and the exact Creative Commons licence version is not stated."
    notes: >
      The project page says "Work is published under the Creative Commons
      (BY-SA) license", linking only to the generic Creative Commons licences
      page; the README says "the Creative Commons license"; no LICENSE file found.

  kialo_revisions:
