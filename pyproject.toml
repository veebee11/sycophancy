[project]
name = "reasonstyle"
version = "0.1.0"
description = "Reason or the Language of Reason? Content vs. explicit reasoning style in LLM pushback response."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Dependencies are added at the stage that first requires them, so the lockfile
# stays justified. Stages are named descriptively because their numbering may
# still change. Deferred:
#   pandas, numpy          -> backend-independent scoring and run tables
#   torch, transformers    -> model-adapter smoke test
#   scikit-learn           -> controlled linear probes
#   scipy / statsmodels    -> factorial analysis (final package not yet chosen)
dependencies = [
    "pydantic>=2.7,<3",
    "pysbd>=0.3.4,<0.4",
    "pyyaml>=6.0,<7",
]

# vLLM is deliberately NOT declared here. It is needed only in the GPU server
# environment, it resolves a large CUDA dependency tree that has no business in
# a lockfile written on a laptop, and the client side needs nothing extra: the
# backend speaks HTTP to a local endpoint through urllib. The server script
# installs it explicitly, and the exact version that produced any text is
# recorded in that run's environment block.

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasonstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
