  backend: Agg
  formats: [svg, png]
  dpi: 200
  font: DejaVu Sans, 9 pt
  size_inches: {single: [6.5, 4.0], wide: [9.0, 5.0], tall: [6.5, 8.5]}
  palette: {base: "#0072B2", instruct: "#D55E00", ab_bfirst: "#009E73", minimal_ab: "#CC79A7", reference: "#0072B2", neutral: "#555555"}
  rules: >-
    every contrast plot has a visible zero line; intervals are drawn as lines with
    point estimates; no significance is encoded by colour alone; svg.hashsalt fixed,
    no creation date in SVG or PNG metadata

outputs:
  root: analysis/behavioral_v3_detailed
  directories: [tables, figures, bootstrap, robustness, review]
  serialization:
    csv: UTF-8, "\n" line ends, header row, rows sorted by their key columns, floats as Python repr (shortest round-trip), missing as empty
    json: sort_keys, indent 2, ensure_ascii false, no NaN (null)
    gzip: mtime 0, no file name, compresslevel 9
    volatile: execution timestamps and host details only in execution_environment.json, which is hashed but excluded from the determinism comparison
  manifest: analysis_manifest.json hashes every output except itself; its own hash goes to analysis_manifest.sha256
  overwrite: refused unless --overwrite and the existing directory's manifest names this analysis_version

software_capture: [python, numpy, matplotlib, pyyaml, platform, analysis-environment requirements file hash]
