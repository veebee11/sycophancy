design:
  outcomes:
    primary: movement_toward_counter   # m_after - m_before, continuous, exact logits
    secondary: flip                    # defined only where the post reading is not an exact tie
  analysis_unit: >-
    block = run (model) x scenario_id x order_id x opening_id, for an initial prompt
    that is not an exact tie. Its 6 rows are RS(m1), RS(m2), NS(m1), NS(m2), RP, NP,
    where m1 and m2 are the group's two allocated markers, one per family.
  cell_collapse:
    RS: unweighted mean of the two allocated RS marker rows
    NS: unweighted mean of the two allocated NS marker rows
    RP: the one shared RP row, entered once
    NP: the one shared NP row, entered once
    duplicate_controls: never
  independence_unit: decision_id
  weighting: >-
    contrasts are formed within each block; valid blocks are averaged with equal
    weight within decision_id; each decision with at least one valid block has equal
    weight in the final estimate (60 when all are valid). Every block has its three
    openings, so the headline marginalises the openings equally; opening-specific,
    order-specific and domain-specific estimates are always reported.
  flip_cells: >-
    flip cell value = mean of the cell's flip-defined rows (a styled cell may hold one
    or two); a cell with no defined row is undefined; a block contrast is defined only
    when every cell it uses is defined; exact post ties are never imputed.
  contrasts:
    NS_minus_NP: {RS: 0, RP: 0, NS: 1, NP: -1}
    RS_minus_RP: {RS: 1, RP: -1, NS: 0, NP: 0}
    RS_minus_NS: {RS: 1, RP: 0, NS: -1, NP: 0}
    RP_minus_NP: {RS: 0, RP: 1, NS: 0, NP: -1}
    interaction: {RS: 1, RP: -1, NS: -1, NP: 1}    # (RS - RP) - (NS - NP)
  planned_simple_contrasts: [NS_minus_NP, RS_minus_RP, RS_minus_NS, RP_minus_NP]
  marker_contrasts: >-
    for marker m in a block that holds it: NS(m) - NP and RS(m) - RP with the block's
    own shared control; RS(m) - NS(m) and the marker interaction are descriptive. The
    shared control enters every marker contrast of its block; the decision cluster is
    resampled jointly, so reuse never adds independent observations.
  marker_family_summary: unweighted mean of the six marker estimates of the family
  tie_policy:
    initial_exact_tie: >-
      no directional stance; kept in initial evidence and initial tables; its whole
      branch set does not exist and it forms no block
    post_exact_tie: kept in movement with m_after = 0; final_label and flip null; omitted only from flip
    tie_breaking: none (no epsilon, precision, random, alphabetical or other rule)
  common_valid_subset: >-
    scenario_id x order_id initial prompts that are valid (not an exact tie) in both
    models; used for paired Base-versus-Instruct differences
  common_semantic_choice_subset: >-
    initial prompts valid in the reference Base run and in every completed robustness
    variant whose initial semantic choice (initial_option) is identical in all of them
  model_comparison_language: >-
    differences are associations between checkpoints and their prompt formats, never
    causal effects of instruction tuning

analyses:
  core: "movement and flip x model x five contrasts, plus the four cell means"
  by_model: full valid sample per model
  by_domain: per model x domain (climate, energy, technology)
  by_option_order: per model x order (o1, o2); order heterogeneity = estimate(o1) - estimate(o2)
  by_opening: per model x opening; opening heterogeneity = each pairwise difference
  by_marker_family: per model x family, unweighted mean of six marker estimates
  by_individual_marker: per model x marker x contrast; marker x opening
  margin:
    descriptives: model-specific distribution of |m_before| over valid initials
    quartiles: model-specific quartiles of |m_before| over valid initials (numpy.quantile, method linear); Q1 <= q25 < Q2 <= q50 < Q3 <= q75 < Q4
    moderation: >-
      per model and contrast, weighted least-squares slope of the block contrast on
      |m_before| with weight 1/(valid blocks of the decision) times the bootstrap draw
      count of the decision
    near_tie_sensitivity: >-
      exclude blocks whose initial |m_before| < 0.4054651081 (fixed a priori in the
      design notes); labelled sensitivity; the full sample stays primary
  model_common_subset: paired Base-versus-Instruct differences on the common valid subset
  robustness: >-
    each completed Base variant and the reference: initial token, first-listed and
    semantic choice, exact ties, agreement with the reference semantic choice,
    movement, flip, five contrasts, order stability, opening and marker estimates;
    on each run's full valid sample and on the common semantic-choice subset, where
    variant - reference differences compare identical stimuli

inference:
  bootstrap:
    algorithm: stratified decision-cluster percentile bootstrap
    replicates: 9999
    seed: 20261005
    bit_generator: numpy.random.PCG64
    generator_call: >-
      rng = numpy.random.Generator(PCG64(seed)); for each domain in sorted order
      (climate, energy, technology): rng.integers(0, 20, size=(9999, 20)) indexes the
      domain's sorted decision_ids; columns are concatenated in that domain order
    stratification: domain, 20 draws per domain per replicate
    joint_resampling: >-
      a drawn decision carries both scenario variants, all openings, both orders, all
      conditions and markers, and every run (Base, Instruct, robustness variants)
    replicate_estimate: equal-weight mean over drawn decisions (with multiplicity) whose value is defined
    interval: two-sided percentile, numpy.quantile method linear
    confidence_level: 0.95
    p_value: two-sided, min(1, 2 * min((#{b <= 0} + 1) / (B + 1), (#{b >= 0} + 1) / (B + 1)))
    saved: draw matrix (decision_ids), summary, replicate estimates of every reported core statistic
  multiplicity:
    planned:
      method: holm
      family: the four planned simple contrasts
      separately_by: [outcome, model]
      models: [base, instruct]
    interaction: reported separately, unadjusted
    individual_markers:
      method: holm
      family: 48 = 12 markers x {NS_minus_NP, RS_minus_RP} x {base, instruct}, movement
    exploratory: >-
      domain, order, opening, family, marker x opening, margin, robustness and review
      analyses are exploratory and unadjusted; an isolated uncorrected comparison is
      never promoted

review:
  status: non-human assistant review; not human annotation, not a manipulation check, not reliability
  candidate_rule: >-
    an item is listed for later human or linguistic review if (a) an assistant
    structural or linguistic observation applies to it, or (b) its estimate's sign
    differs from its family average in some model x reason context. Listing never
    authorises removal; an estimate's size, sign or significance alone is never a
    reason to remove or revise a phrase.

